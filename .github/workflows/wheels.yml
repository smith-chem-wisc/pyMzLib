# Builds and tests a pyMzLib wheel for every supported platform, on machines we do not own.
#
# This is the answer to "do I need a Mac?" — no. GitHub runs the macOS, Linux, and Windows jobs
# below on its own hardware. Building the payload for a platform never needs that platform
# (`dotnet publish -r osx-arm64` cross-compiles fine from Linux); only *testing* it does, and
# that is what the matrix is for.
#
# Note on cost: macOS runner minutes are free and unmetered on public repositories, and billed at
# 10x on private ones — one reason this repository is public.

name: wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # The mzLib commit is NOT here. It lives in code/mzlib.pin, and every job below reads that file.
  #
  # It used to be an `env:` entry in this workflow, which was fine while a human moved it and wrong
  # the moment anything else wanted to. GitHub refuses a push that modifies a file under
  # .github/workflows/ when it is authenticated with the default GITHUB_TOKEN — so a pin living in
  # this file can only be bumped by a human or by a stored PAT with `workflow` scope. Moving the one
  # value that legitimately changes on someone else's schedule into a plain file means
  # upstream-watch.yml can open its bump PR with no secret at all and no elevated scope.
  #
  # The pin still exists for the original reason: the bridge and the Python package must be built
  # from the same mzLib source, so it is pinned rather than tracking master. Its provenance — which
  # release, which PRs, and why — is recorded in code/PINNED.md.
  DOTNET_VERSION: '8.0.x'

jobs:
  # ---------------------------------------------------------------------------------------
  # A tag must agree with the version the package declares. Nothing checked this until
  # 2026-08-09, and the gap is not theoretical: cutting v0.1.0.dev4 while __init__.py still said
  # 0.1.0.dev3 would have built four wheels named 0.1.0.dev3, attached them to a release page
  # headed v0.1.0.dev4, and gone entirely green. Only a manual bump kept that release honest.
  #
  # It is worth failing loudly over because it is close to unrecoverable. PyPI and crates.io both
  # refuse to reissue a version number once taken, so a mislabelled artefact cannot be replaced —
  # only yanked and superseded. And it is the kind of wrong nobody notices from inside the repo:
  # the build is correct, the tests pass, the wheels install. It surfaces when a user reports
  # having installed something other than what the release page advertised.
  #
  # Both sibling bindings' release.yml gained this check when they were written (mzLibRust#11,
  # mzLibR#8); this repository is the one that had it only as a habit. No `needs:`, so it runs
  # immediately rather than after the cross-platform matrix — a tag typo should cost seconds.
  # ---------------------------------------------------------------------------------------
  tag-matches-version:
    name: the tag matches the declared version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with __version__
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"

          # Read it the way hatchling does — from the source of truth named in pyproject.toml
          # ([tool.hatch.version] path) — rather than re-deriving it, so this cannot pass while the
          # build reads something else.
          declared=$(python -c "
          import pathlib, re
          text = pathlib.Path('pkg/python/src/pymzlib/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__ = \"([^\"]+)\"', text, re.MULTILINE)
          if not match:
              raise SystemExit('no __version__ found in pkg/python/src/pymzlib/__init__.py')
          print(match.group(1))
          ")

          echo "tag says      $tag"
          echo "__init__ says $declared"

          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match __version__ $declared. The wheels would be built and published as $declared under a release page headed v$tag. Bump pkg/python/src/pymzlib/__init__.py, or retag."
            exit 1
          fi

  # ---------------------------------------------------------------------------------------
  # Both languages, both coverage gates. This runs first and fastest: a failure here should
  # stop the expensive cross-platform matrix below.
  # ---------------------------------------------------------------------------------------
  tests:
    name: tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned mzLib
        shell: bash
        run: |
          set -euo pipefail
          # Read, then validate. A pin file that has been mangled — an empty file, a stray branch
          # name, a truncated sha — would otherwise reach `git checkout` and fail there with a
          # message about a bad revision, which reads like mzLib's problem rather than ours.
          pin=$(tr -d '[:space:]' < code/mzlib.pin)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::code/mzlib.pin must hold a full 40-character mzLib commit sha; got '$pin'"
            exit 1
          fi
          echo "Building against mzLib $pin"
          git clone --filter=blob:none --no-checkout https://github.com/smith-chem-wisc/mzLib.git code/mzLib
          git -C code/mzLib checkout --detach "$pin"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- C# -------------------------------------------------------------------------------
      # ExternalService tests are excluded here and run in their own job below. This job must be
      # able to fail only for reasons that are our fault.
      - name: Bridge tests
        run: >
          dotnet test pkg/bridge.tests/MzLibBridge.Tests.csproj
          -c Release -p:Platform=x64 --nologo
          --filter "TestCategory!=ExternalService"
          --collect:"XPlat Code Coverage"

      # The raw number from the line above covers all of mzLib and reads about 0.6%, which is
      # meaningless rather than bad. This scopes it to code we actually wrote and enforces it.
      - name: Bridge coverage gate
        shell: pwsh
        # -Configuration Release: the tests above build -c Release -p:Platform=x64, so the report and
        # its assembly live under bin/x64/Release; the gate must judge freshness against that build,
        # not the Debug default (which would find no assembly here).
        run: ./pkg/build/check-bridge-coverage.ps1 -Configuration Release

      # --- Python ---------------------------------------------------------------------------
      - name: Build the bridge for the Python tests
        shell: pwsh
        run: ./pkg/build/publish-bridge.ps1 -Runtime linux-x64

      - name: Python tests, offline
        working-directory: pkg/python
        run: |
          pip install -e ".[dev]"
          pytest -m "not network" --cov=pymzlib --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: pkg/python/coverage.xml,pkg/bridge.tests/TestResults/*/coverage.cobertura.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------------------
  # Live canaries against EBI, in their own job, following mzLib's ExternalService convention.
  #
  # Everything above runs against stubs and recorded fixtures, so it would keep passing even if
  # PRIDE changed its API tomorrow. These are the tests that would notice — and they are the only
  # ones whose result depends on a third party, which is exactly why they are quarantined here
  # rather than mixed into the required run.
  #
  # There is no continue-on-error, deliberately. The bridge classifies availability failures as
  # ServiceUnavailable, and both suites turn that into a *skip* with an explanatory message. So a
  # failure in this job means the contract broke, not that EBI is down — which is the whole point:
  # a red result should never leave anyone wondering whose fault it is.
  # ---------------------------------------------------------------------------------------
  external-services:
    name: live canaries (PRIDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned mzLib
        shell: bash
        run: |
          set -euo pipefail
          # Read, then validate. A pin file that has been mangled — an empty file, a stray branch
          # name, a truncated sha — would otherwise reach `git checkout` and fail there with a
          # message about a bad revision, which reads like mzLib's problem rather than ours.
          pin=$(tr -d '[:space:]' < code/mzlib.pin)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::code/mzlib.pin must hold a full 40-character mzLib commit sha; got '$pin'"
            exit 1
          fi
          echo "Building against mzLib $pin"
          git clone --filter=blob:none --no-checkout https://github.com/smith-chem-wisc/mzLib.git code/mzLib
          git -C code/mzLib checkout --detach "$pin"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bridge canaries
        run: >
          dotnet test pkg/bridge.tests/MzLibBridge.Tests.csproj
          -c Release -p:Platform=x64 --nologo
          --filter "TestCategory=ExternalService"
          --logger "console;verbosity=normal"

      - name: Build the bridge for the Python canaries
        shell: pwsh
        run: ./pkg/build/publish-bridge.ps1 -Runtime linux-x64

      - name: Python canaries
        working-directory: pkg/python
        run: |
          pip install -e ".[dev]"
          pytest -m network -v -rs   # -rs prints the reason for any skip, so an outage is visible

  # ---------------------------------------------------------------------------------------
  # One Linux runner cross-builds every platform's payload and wheel. Cheap, and it keeps the
  # macOS runners for the job only they can do: actually running the thing.
  # ---------------------------------------------------------------------------------------
  build:
    needs: tests
    name: build wheel (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            plat_tag: win_amd64
          # These tags are a COMPATIBILITY PROMISE, not a label. They previously claimed
          # manylinux_2_17 (glibc 2.17 / CentOS 7) and macOS 11, both of which are below what
          # .NET 8 actually requires — glibc 2.23 and macOS 12. A user on RHEL 7 therefore got a
          # successful pip install and a runtime failure, and no CI runner is old enough to
          # notice. The floors below match .NET 8's documented supported set; the manylinux_2_28
          # job in `test` is what actually holds them honest.
          - rid: linux-x64
            plat_tag: manylinux_2_28_x86_64
          - rid: osx-x64
            plat_tag: macosx_12_0_x86_64
          - rid: osx-arm64
            plat_tag: macosx_12_0_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned mzLib
        shell: bash
        run: |
          set -euo pipefail
          # Read, then validate. A pin file that has been mangled — an empty file, a stray branch
          # name, a truncated sha — would otherwise reach `git checkout` and fail there with a
          # message about a bad revision, which reads like mzLib's problem rather than ours.
          pin=$(tr -d '[:space:]' < code/mzlib.pin)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::code/mzlib.pin must hold a full 40-character mzLib commit sha; got '$pin'"
            exit 1
          fi
          echo "Building against mzLib $pin"
          git clone --filter=blob:none --no-checkout https://github.com/smith-chem-wisc/mzLib.git code/mzLib
          git -C code/mzLib checkout --detach "$pin"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish the self-contained bridge
        shell: pwsh
        run: ./pkg/build/publish-bridge.ps1 -Runtime ${{ matrix.rid }}

      # The same binary the wheel is about to swallow, kept as an asset in its own right.
      #
      # A wheel is a Python artifact, and two of the three bindings are not Python: mzLibRust does
      # not know what a wheel is, and mzLibR only knows because install-bridge.R was taught to
      # unzip one. Both repositories' `live` jobs currently stop at `exit 1` with a comment saying
      # they are waiting for exactly this file to exist somewhere fetchable.
      #
      # An archive rather than a bare binary, because the payload is a TREE, not one file: the
      # executable sits alongside libmmd.dll, Resources/ (unimod.xml, PSI-MOD, ptmlist) and the
      # Bruker/timsTOF native libs. Publishing only the executable would ship something that starts
      # and then fails the moment it needs a modification table.
      #
      # tar.gz rather than zip for the executable bit. A zip CAN record a Unix mode — the wheels
      # do, at 0755 — but restoring it is the extractor's choice, and the common ones do not:
      # R's utils::unzip() drops it, which is why mzLibR carries bridge_make_runnable() to chmod
      # afterwards (install-bridge.R:254-265). tar restores the mode by default, so a consumer
      # extracts and runs. Verified: the packed tree lists mzlib-bridge as -rwxr-xr-x and survives
      # a round trip.
      #
      # Staged BEFORE the wheel build so this is provably the same bytes the wheel ships, not a
      # rebuild that happens to agree.
      - name: Package the raw bridge
        shell: bash
        run: |
          set -euo pipefail
          stage="pkg/python/src/pymzlib/_dotnet/${{ matrix.rid }}"
          mkdir -p bridge_dist
          tar -czf "bridge_dist/mzlib-bridge-${{ matrix.rid }}.tar.gz" -C "$stage" .
          ls -lh bridge_dist

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.rid }}
          path: bridge_dist/*.tar.gz

      - name: Build the wheel
        working-directory: pkg/python
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel --outdir dist_untagged

      # hatchling produces a py3-none-any wheel because there is no compiled Python code in the
      # package. That is wrong here: the wheel carries a platform binary, so it must refuse to
      # install on the wrong OS. Retagging is the standard fix and is why we get ONE wheel per
      # operating system rather than one per OS x Python version (decision D7).
      - name: Retag as a platform wheel
        working-directory: pkg/python
        run: |
          python -m wheel tags \
            --python-tag py3 --abi-tag none \
            --platform-tag ${{ matrix.plat_tag }} \
            --remove \
            dist_untagged/*.whl
          ls -lh dist_untagged

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.rid }}
          path: pkg/python/dist_untagged/*.whl

  # ---------------------------------------------------------------------------------------
  # Install each wheel the way a stranger would, on the real operating system, and run the
  # tests against it. Only the floor and the ceiling Python are tested: with no compiled
  # extension, the versions in between cannot differ in a way these tests would catch.
  # ---------------------------------------------------------------------------------------
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, python: '3.9' }
          - { os: ubuntu-latest,  rid: linux-x64, python: '3.14' }
          - { os: windows-latest, rid: win-x64,   python: '3.9' }
          - { os: windows-latest, rid: win-x64,   python: '3.14' }
          - { os: macos-14,       rid: osx-arm64, python: '3.14' }   # Apple Silicon
          - { os: macos-15-intel, rid: osx-x64,   python: '3.14' }   # Intel
          #
          # macos-13 was retired on 4 December 2025, and a job naming a retired image queues
          # forever rather than failing — a miserable way to find out. macos-15-intel is the
          # designated replacement and the last Intel image; GitHub retires x86-64 macOS runners
          # in Fall 2027. When that lands, drop this row but KEEP building the osx-x64 wheel:
          # Intel Macs will still be doing real work in labs long after GitHub stops offering
          # them, and an untested wheel beats no wheel.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.rid }}
          path: wheelhouse

      # Deliberately NOT an editable install of the source tree — install the built artifact,
      # so what is tested is what a user would receive.
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install wheelhouse/*.whl

      - name: The whole claim, in one line
        shell: bash
        run: python -c "import pymzlib; print(pymzlib.bridge_version())"

      - name: Offline tests
        working-directory: pkg/python
        run: python -m pytest -m "not network" -v

      # A skip here means EBI was unavailable, not that this platform is broken; -rs prints the
      # reason so the distinction is visible in the log.
      - name: Live canaries
        working-directory: pkg/python
        run: python -m pytest -m "network" -v -rs
  # ---------------------------------------------------------------------------------------
  # The claim being made is "you do not need .NET installed." GitHub's runners have .NET on
  # them, so passing there does not prove it. A stock python:slim container does.
  # ---------------------------------------------------------------------------------------
  no-dotnet:
    name: works with no .NET installed
    needs: build
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x64
          path: wheelhouse

      - name: Confirm this machine really has no .NET
        run: |
          if command -v dotnet; then echo "::error::dotnet is present; this test proves nothing"; exit 1; fi
          echo "no dotnet on PATH, as intended"

      # Deliberately NOT a live PRIDE call. This job gates the release, and what it exists to prove
      # is that the bundled runtime works without .NET installed — which bridge_version() shows by
      # executing the payload end to end. Calling PRIDE here would additionally make an EBI outage
      # block a release, and would bypass the outage-classification convention every other live
      # test routes through.
      - name: Install and use pyMzLib
        run: |
          pip install wheelhouse/*.whl
          python -c "import pymzlib; info = pymzlib.bridge_version(); print(info); assert info['protocol'] == 1"

  # ---------------------------------------------------------------------------------------
  # The oldest Linux we claim to support. Every other runner is glibc 2.31+, so nothing else
  # in this workflow can catch a wheel tagged for a glibc older than .NET actually needs — and
  # that user (an old cluster, a Python they cannot change) is precisely who this package is for.
  # ---------------------------------------------------------------------------------------
  glibc-floor:
    name: runs on the oldest glibc we claim
    needs: build
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x64
          path: wheelhouse

      - name: Install and run on manylinux_2_28
        run: |
          ldd --version | head -1
          # The PyPA images keep interpreters under /opt/python/<tag>/bin rather than on PATH.
          PY=$(ls -d /opt/python/cp311-cp311/bin/python3 2>/dev/null || command -v python3.11 || command -v python3)
          echo "using $PY"
          "$PY" -m pip install --quiet wheelhouse/*.whl
          "$PY" -c "import pymzlib; print(pymzlib.bridge_version())"

  # ---------------------------------------------------------------------------------------
  # Attach the built artifacts to the GitHub Release for the tag. This is the step whose absence
  # shipped a v0.1.0.dev3 release page advertising wheels that were never uploaded: the workflow
  # only ever produced ephemeral Actions artifacts and (separately) a PyPI publish that is gated
  # off. Attaching to the Release was a manual step, and manual steps get skipped.
  #
  # Unlike the PyPI job below, this has NO PYPI_PUBLISH gate: the whole point of the GitHub Release
  # is to distribute wheels while the project is not yet on PyPI, so it must run on every v* tag.
  # It waits on the same platform gates the PyPI job does, so a wheel that fails to install or run
  # on any supported OS never reaches the Release.
  #
  # The release for the tag is expected to already exist (created by hand, with notes). This job
  # only adds assets: no `body`/`name` is passed, so the existing notes are left untouched. If the
  # release does not exist yet, the action creates a minimal one rather than failing.
  #
  # Three kinds of asset go up, and they serve different consumers:
  #   *.whl        — pip, and mzLibR's install-bridge.R, which unzips one to get at the binary.
  #   *.tar.gz     — the raw bridge, for the bindings that are not Python. This is what mzLibRust
  #                  and mzLibR are blocked on; see the note in the build job.
  #   SHA256SUMS   — so a consumer pinning these can verify, and re-pin mechanically. mzLibR
  #                  hardcodes four digests today and its comment says bumping the version means
  #                  re-recording all four by hand. This is that file.
  # ---------------------------------------------------------------------------------------
  github-release:
    name: attach assets to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tag-matches-version, tests, external-services, build, test, no-dotnet, glibc-floor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          merge-multiple: true
          path: dist

      # Named explicitly rather than `sha256sum *`. Not for the reason one might assume — the glob
      # is expanded before the redirect creates SHA256SUMS, so on a fresh runner the wildcard form
      # would not list the file itself. The reason is that `*` publishes whatever happens to be in
      # the directory, so a stray artifact silently acquires the authority of a signed manifest,
      # and a MISSING class of artifact goes unnoticed because nothing was named to be absent.
      # Listing the two extensions states what a release must contain: if the bridges failed to
      # upload, `*.tar.gz` matches nothing, bash passes the pattern through literally, sha256sum
      # exits 1 on it and `set -e` fails the job. The wildcard form exits 0 and publishes a
      # manifest that is short by four files. Both behaviours confirmed by hand.
      - name: Record checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: List what will be attached
        run: ls -lh dist

      - name: Attach the wheels, the bridges, and the checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          # A tag with no matching wheels means an upstream job silently produced nothing —
          # fail loudly rather than "succeed" with an empty release.
          fail_on_unmatched_files: true
          # Keep this release out of "Latest" while the project is in dev previews. The scheme is
          # X.Y.Z.devN today; extend this if alpha/beta/rc tags start being cut.
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  # ---------------------------------------------------------------------------------------
  # Publish, on a tag, via Trusted Publishing. No stored API token: PyPI verifies the workflow's
  # OIDC identity instead. Deliberately no sdist — a source-only sdist for a package whose whole
  # value is the bundled binary installs "successfully" and then fails on first call, whereas
  # wheels-only gives an unsupported platform a clean "no matching distribution found".
  # ---------------------------------------------------------------------------------------
  release:
    name: publish to PyPI
    # Two gates, both required. The tag gate is obvious. The PYPI_PUBLISH repository-variable gate
    # is a safety switch: PyPI cannot accept an upload from this project until two one-time manual
    # steps are done off GitHub — a Trusted Publisher is registered for this workflow on PyPI, and
    # the >100 MB file-size limit is granted (pyMzLib's wheels are ~115 MB). Until both are in
    # place, a v* tag would fire this job only to fail — or worse, publish a broken first version
    # that PyPI then locks forever. So publishing stays OFF until someone sets the repository
    # variable PYPI_PUBLISH=true (Settings → Secrets and variables → Actions → Variables). Until
    # then, tagging still builds, tests, and gates wheels on every platform — it just doesn't ship.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    # external-services is included deliberately. Gating a release on the live canaries is safe
    # precisely because they SKIP on an EBI outage rather than failing, so this cannot block a
    # release when PRIDE is merely down — but it does block one when the API contract has actually
    # broken, which is the only state in which shipping would be wrong.
    needs: [tag-matches-version, tests, external-services, build, test, no-dotnet, glibc-floor]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymzlib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the artifacts before anything is published
        run: |
          pip install --quiet twine
          ls -lh dist
          twine check --strict dist/*.whl

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false
