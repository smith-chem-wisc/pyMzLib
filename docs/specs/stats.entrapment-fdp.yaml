# Written 2026-10-21 with the verb, from pyMzLib pkg/bridge/Statistics.EntrapmentFdp.cs (Entrapment,
# ReadTargets, ReadEntrapments, ReadCandidateTable, EntrapmentCaveats) on branch feat/stats-models
# (off main 50b4340), mzLib pin d10017ce (tag 1.0.595; EntrapmentFdp is from #1385, first in
# 1.0.595). Example fixtures recorded from the live bridge on that branch, over mzLib's own
# hand-built search (Test/StatisticalModels/EntrapmentFdpTests.cs: seven targets, four entrapments,
# one per branch of the paired estimator), written as the verb's two TSVs by
# StatisticsTests.EntrapmentFixtures_AreMzLibsReferenceSearch. Agreement with the entrapment
# project's reference script (results/fdp/fdp_analysis.py at commit 92f3108, whose r = 1 output
# mzLib's test carries) is held through the wire by
# StatisticsTests.EntrapmentFdp_ReproducesTheReferenceScript_ThroughTheWire. Constructed numbers,
# not a real search: mzLib ships no real entrapment search.
verb: stats entrapment-fdp
module: stats
summary: >-
  Estimate the false discovery proportion among a search's discoveries from its entrapment hits, as
  a lower bound, a combined upper bound and a paired upper bound, at each of several q-value
  thresholds.
since: {protocol: 1, pymzlib: "0.6.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: EntrapmentFdp.Sweep, path: mzLib/StatisticalModels/EntrapmentFdp.cs, pin: d10017ce}
  - {symbol: EntrapmentFdp.DefaultQValueThresholds, path: mzLib/StatisticalModels/EntrapmentFdp.cs, pin: d10017ce}
  - {symbol: ScoredIdentification, path: mzLib/StatisticalModels/EntrapmentFdp.cs, pin: d10017ce}
  - {symbol: ScoredEntrapment, path: mzLib/StatisticalModels/EntrapmentFdp.cs, pin: d10017ce}
  - {symbol: EntrapmentFdpPoint, path: mzLib/StatisticalModels/EntrapmentFdp.cs, pin: d10017ce}
cite:
  - {doi: "10.1038/s41592-025-02719-x", for: "the lower-bound (eq. 2), combined (eq. 1) and paired (eq. 4) entrapment estimators mzLib implements, and why the sample estimator is invalid (Wen et al., Nat Methods 22:1454, 2025; the method FDRBench implements)"}

params:
  - name: targets
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      A TSV with a header row naming EXACTLY the columns score and q_value, in any order, then one
      row per original-target candidate (mzLib's ScoredIdentification): the unit you estimate the
      FDP of (precursor, peptide or protein group), decoys removed, each with its best q-value.
      score is the search's score, higher is better, on the same scale as the entrapments'; q_value
      is the q-value the search reported, a fraction. Every cell must be a finite number. Any other
      column is refused: select the two before writing the file.
  - name: entrapments
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      A TSV with a header row naming the columns score, q_value, partner_score and partner_q_value,
      and optionally foreign, in any order, then one row per entrapment candidate (mzLib's
      ScoredEntrapment). partner_score and partner_q_value are a COPY of the score and q-value of
      the one original target this entrapment was made from, when the search identified it; leave
      both blank (or NA) when it did not, when it cannot be resolved to one target, or when there is
      none. mzLib does not check them against the targets file. foreign is 1 or true for an
      entrapment with no target partner by construction (a foreign species), 0 or false otherwise;
      a blank cell, or no foreign column, is mzLib's default (ScoredEntrapment.IsForeign false).
      Any other column is refused, so a misspelt foreign column cannot fall back to the default.
  - name: ratio
    type: float
    required: true
    unit: "entrapment-to-target database size ratio (unitless)"
    range: "> 0 and finite (mzLib's rule; anything else is mzLib's refusal, a usage error)"
    default: null
    doc: >-
      r, the effective ratio of entrapment to target database size, used by the combined estimate.
      REQUIRED: mzLib has no default. paired is reported only when r is exactly 1: for 1:1 pairing
      give 1 itself, not a ratio computed from database sizes after exclusions (0.9998 drops it).
  - name: thresholds
    type: "float[]"
    required: false
    unit: "q-value (fraction, 0 to 1)"
    range: "comma-separated finite numbers"
    default: null
    doc: >-
      The q-value thresholds to estimate at, comma-separated, in the order the rows should come in.
      A candidate is discovered at a threshold when its q-value is at or below it. Absent, the bridge
      sends mzLib's EntrapmentFdp.DefaultQValueThresholds (0.001, 0.002, ..., 0.100, each i/1000, at
      d10017ce) and echoes them.

result:
  envelope_fields:
    - {wire: targets_file, type: string, unit: null, nullable: false, null_means: null, doc: "Absolute path of the targets table."}
    - {wire: entrapments_file, type: string, unit: null, nullable: false, null_means: null, doc: "Absolute path of the entrapments table."}
    - {wire: ratio, type: float, unit: "entrapment-to-target database size ratio (unitless)", nullable: false, null_means: null, doc: "r, as given."}
    - {wire: thresholds, type: "float[]", unit: "q-value (fraction, 0 to 1)", nullable: false, null_means: null, doc: "The thresholds estimated at, in order: the --thresholds given, or mzLib's default."}
    - {wire: thresholds_given, type: bool, unit: null, nullable: false, null_means: null, doc: "True when --thresholds was given; false when thresholds is mzLib's DefaultQValueThresholds."}
    - {wire: target_candidate_count, type: int, unit: candidates, nullable: false, null_means: null, doc: "Rows read from the targets file."}
    - {wire: entrapment_candidate_count, type: int, unit: candidates, nullable: false, null_means: null, doc: "Rows read from the entrapments file."}
    - {wire: foreign_count, type: int, unit: candidates, nullable: false, null_means: null, doc: "Entrapments marked foreign."}
    - {wire: partnered_count, type: int, unit: candidates, nullable: false, null_means: null, doc: "Entrapments with a partner."}
    - {wire: threshold_count, type: int, unit: thresholds, nullable: false, null_means: null, doc: "The length of thresholds."}
    - {wire: empty_threshold_count, type: int, unit: thresholds, nullable: false, null_means: null, doc: "Thresholds at which nothing was discovered, where every estimate is 0/0, so mzLib leaves them out of the table."}
    - {wire: row_count, type: int, unit: rows, nullable: false, null_means: null, doc: "threshold_count - empty_threshold_count."}
    - {wire: column_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "The table's columns, in order."}
    - {wire: columns, type: table, unit: null, nullable: false, null_means: null, doc: "One row per threshold with a discovery, in thresholds order."}
    - {wire: caveats, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Five static caveats, plus one each when a threshold had no discoveries, when paired is null at every threshold (with the ratio and the foreign count), and when no entrapment has a partner."}
  columns:
    - {wire: q_value_threshold, type: float, unit: "q-value (fraction, 0 to 1)", nullable: false, null_means: null, doc: "The threshold."}
    - {wire: target_count, type: int, unit: discoveries, nullable: false, null_means: null, doc: "N_T: targets with a q-value at or below the threshold."}
    - {wire: entrapment_count, type: int, unit: discoveries, nullable: false, null_means: null, doc: "N_E: entrapments with a q-value at or below the threshold."}
    - {wire: lower_bound, type: float, unit: "fraction of discoveries (an FDP estimate)", nullable: false, null_means: null, doc: "Eq. 2, N_E / (N_T + N_E). A lower bound on the FDP: above the claimed FDR, it shows the search fails to control it; below, it shows nothing."}
    - {wire: combined, type: float, unit: "fraction of discoveries (an FDP estimate; can exceed 1)", nullable: false, null_means: null, doc: "Eq. 1, N_E (1 + 1/r) / (N_T + N_E). An upper bound: at or below the claimed FDR, it is evidence of control. Not capped at 1."}
    - {wire: paired, type: float, unit: "fraction of discoveries (an FDP estimate; can exceed 1)", nullable: true, null_means: "does not apply: the ratio is not exactly 1, or every entrapment is foreign", doc: "Eq. 4, (N_E + N_{E>=s>T} + 2 N_{E>T>=s}) / (N_T + N_E): a tighter upper bound for 1:1 pairing. N_{E>=s>T} counts discovered entrapments whose partner was not discovered (no partner counts so); N_{E>T>=s} those whose partner was discovered but ranked behind them, by lower q-value and then higher score, an exact tie counting the entrapment ahead. Not capped at 1."}

errors:
  - {kind: usage, when: "targets or entrapments missing, blank or not found; a table empty; a header with an empty, repeated, missing or unknown column (each named); a row whose field count differs from its header; a score or q_value that is not a finite number; a partner with a score but no q-value or the reverse, or not finite; a foreign cell other than 0, 1, true, false or blank"}
  - {kind: usage, when: "--ratio absent, without a value or not a number; --thresholds without a value, empty, or with an entry that is not a finite number"}
  - {kind: usage, when: "mzLib refuses the ratio (its ArgumentOutOfRangeException, reclassified): not a positive finite number"}
  - {kind: correctness, when: "never expected"}
  - {kind: service_unavailable, when: never}

caveats:
  - "Wen et al. 2025, as FDRBench implements it. lower_bound can only show that a search fails to control its FDR; combined is an upper bound, evidence that it does; paired is a tighter upper bound for 1:1 pairing. None is capped at 1."
  - "A candidate is discovered when its q-value is at or below the threshold, and a partner by its own q-value. A discovered pair is ranked lower q-value first, then higher score, and an exact tie counts against the search."
  - "Give one row per unit estimated (precursor, peptide or protein group), decoys removed, each with its best q-value: mzLib does not deduplicate. A partner's score and q-value are copies of its target's row, and mzLib does not check them."
  - "paired is reported only for a ratio of exactly 1 with some entrapment not foreign. The sample estimator N_E / (r N_T), invalid in both directions, is deliberately absent (mzLib), and the k-fold paired estimator for k entrapments per target is not implemented."
  - "An entrapment generator's exclusions change the inputs in opposite directions (mzLib's EntrapmentFdp.ClassifyExclusion): an entrapment that is really a target peptide comes out of the entrapments file; a target that cannot be traced to one target stays in the targets file but is nobody's partner."

bindings:
  py: {name: pymzlib.stats.entrapment_fdp}
  rust: {name: "mzlib::stats::entrapment_fdp_with", options: EntrapmentFdpOptions}
  r: {name: stats_entrapment_fdp}

examples:
  - fixture: stats_entrapment_fdp_reference.json
    py: "fdp = pymzlib.stats.entrapment_fdp('entrapment_reference_targets.tsv', 'entrapment_reference_entrapments.tsv', ratio=1.0)"
    rust: "let fdp = mzlib::stats::entrapment_fdp_with(\"entrapment_reference_targets.tsv\", \"entrapment_reference_entrapments.tsv\", 1.0, &EntrapmentFdpOptions::default())?;"
    r: "fdp <- stats_entrapment_fdp('entrapment_reference_targets.tsv', 'entrapment_reference_entrapments.tsv', ratio = 1)"
  - fixture: stats_entrapment_fdp_reference_r2.json
    py: "fdp = pymzlib.stats.entrapment_fdp('entrapment_reference_targets.tsv', 'entrapment_reference_entrapments.tsv', ratio=2.0, thresholds=[0.01, 0.05])"
    rust: "let fdp = mzlib::stats::entrapment_fdp_with(\"entrapment_reference_targets.tsv\", \"entrapment_reference_entrapments.tsv\", 2.0, &EntrapmentFdpOptions { thresholds: Some(vec![0.01, 0.05]), ..Default::default() })?;"
    r: "fdp <- stats_entrapment_fdp('entrapment_reference_targets.tsv', 'entrapment_reference_entrapments.tsv', ratio = 2, thresholds = c(0.01, 0.05))"

open_questions: []
