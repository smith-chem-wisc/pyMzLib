# Written 2026-09-23 from pyMzLib pkg/bridge/Reading.cs (Formats, ViewsOf, RecordTypeOf) on branch
# chore/mzlib-pin-1.0.592 (pyMzLib#61), mzLib pin 23c2490e (tag 1.0.592). The example fixture was
# re-recorded from the live bridge on that branch.
verb: readers formats
module: readers
summary: >-
  List every file type mzLib recognises, with the extension it dispatches on, the reader class that
  parses it, and the cross-format views it offers.
since: {protocol: 1, pymzlib: "0.1.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: SupportedFileType, path: mzLib/Readers/Util/SupportedFileTypes.cs, pin: 23c2490e}
  - {symbol: SupportedFileTypeExtensions.GetFileExtension, path: mzLib/Readers/Util/SupportedFileTypes.cs, pin: 23c2490e}
  - {symbol: SupportedFileTypeExtensions.GetResultFileType, path: mzLib/Readers/Util/SupportedFileTypes.cs, pin: 23c2490e}
cite: []

params: []

result:
  envelope_fields:
    - {wire: format_count, type: int, unit: formats, nullable: false, null_means: null, doc: "Number of entries in formats; equal to the number of SupportedFileType members. 36 at mzLib 1.0.592 (32 at 1.0.591)."}
    - {wire: formats, type: table, unit: null, nullable: false, null_means: null, doc: "One entry per SupportedFileType, in enum declaration order. Enumerated from mzLib, not transcribed, so it cannot drift from what mzLib dispatches."}
  # Fields of each entry in `formats` (a list of records, not a column dict).
  columns:
    - {wire: file_type, type: string, unit: null, nullable: false, null_means: null, doc: "mzLib's SupportedFileType member name, e.g. \"MsFraggerPsm\", \"psmtsv\", \"MzIdentMLGz\"."}
    - {wire: extension, type: string, unit: null, nullable: true, null_means: "mzLib has no extension mapping for this member (a broken mzLib build); the listing reports it rather than failing", doc: "The suffix mzLib dispatches on, e.g. \".mzid.gz\" or \"QuantifiedProteinGroups.tsv\". NOT unique: both Bruker types are \".d\" and several share \".tsv\"; DiaNnReport and PytheasResult dispatch on content, not on this value."}
    - {wire: reader, type: string, unit: null, nullable: true, null_means: "mzLib has no reader mapping for this member (a broken mzLib build)", doc: "The mzLib reader class name, e.g. \"MzIdentMLResultFile\"."}
    - {wire: views, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Cross-format views this type offers, from quantifiable, ms1_features, spectra, spectral_match. Empty is a real answer: 17 of 36 types offer none and are readable only through read-records."}

errors:
  - {kind: usage, when: never}
  - {kind: correctness, when: never}
  - {kind: service_unavailable, when: never}

caveats:
  - "Extensions are not unique and not always how dispatch works: identify a real path rather than matching on extension."
  - "An empty views list means mzLib parses the format into its own record type with no cross-format interface; read-records still reads it."
  - "At mzLib 1.0.592 the view families are: quantifiable 4, ms1_features 2, spectral_match 6, spectra 7, none 17. These counts are the pin's, not the contract's: bindings should call formats rather than repeat them in prose."

bindings:
  py: {name: pymzlib.readers.formats}
  rust: {name: "mzlib::readers::formats"}
  r: {name: readers_formats}

examples:
  - fixture: readers_formats.json
    py: "formats = pymzlib.readers.formats()"
    rust: "let formats = mzlib::readers::formats()?;"
    r: "formats <- readers_formats()"

open_questions: []
