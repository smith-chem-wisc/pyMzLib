# Written 2026-09-24 from pyMzLib origin/main 06bfca9: pkg/bridge/Quantification.cs (FlashLfq,
# BuildSpectraFiles, ParseDesignField, ToWire, Finite), pkg/python/src/pymzlib/flashlfq.py (quantify,
# FlashLfqResults, SpectraFileInfo, Peptide, ProteinGroup, Peak), mzLib pin 23c2490e (FlashLfqEngine
# constructor thread clamp; #1155 merged at aed283a5). Example fixture flashlfq_small.json is a small
# hand-shaped payload (paths "/abs/..."), not a live recording.
verb: quant flashlfq
module: quant
summary: >-
  Quantify a search's peptides and proteins across mzML runs with FlashLFQ, returning per-run
  peptide and protein intensities and every chromatographic peak.
since: {protocol: 1, pymzlib: "0.1.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: FileReader.ReadQuantifiableResultFile, path: mzLib/Readers/FileReader.cs, pin: 23c2490e}
  - {symbol: MzLibExtensions.MakeIdentifications, path: mzLib/FlashLFQ/ResultsReading/MzLibExtensions.cs, pin: 23c2490e}
  - {symbol: FlashLfqParameters, path: mzLib/FlashLFQ/FlashLfqParameters.cs, pin: 23c2490e}
  - {symbol: FlashLfqEngine.Run, path: mzLib/FlashLFQ/FlashLfqEngine.cs, pin: 23c2490e}
  - {symbol: FlashLfqResults.WriteResults, path: mzLib/FlashLFQ/FlashLFQResults.cs, pin: 23c2490e}
  - {symbol: SpectraFileInfo, path: mzLib/MassSpectrometry/SpectraFileInfo.cs, pin: 23c2490e}
cite:
  - {doi: "10.1021/acs.jproteome.7b00608", for: "FlashLFQ: the peak-finding, match-between-runs and protein quantification this verb runs (Millikin et al., J Proteome Res 2018)"}

params:
  - name: psms
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      A quantifiable PSM result file mzLib can read: a MetaMorpheus .psmtsv/.osmtsv, an MSFragger
      psm.tsv (retention time converted to minutes by the reader since mzLib#1116), or a DIA-NN
      main report, report.tsv or (since mzLib 1.0.595, #1384) DIA-NN 2.x's report.parquet, whose
      runs are named by its Run column (FileReader.ReadQuantifiableResultFile at the pin; the
      parquet is checked as far as run matching, since mzLib ships no spectra for its sample's
      run). MSFragger combined results
      (MsFraggerCombinedResults) implement IQuantifiableResultFile but are not reachable: the path
      must be a file, and GetResultFileType never maps to that class. Every run the file names
      must have an mzML on stdin, matched by base file name.
  - name: stdin
    type: "string[]"
    required: true
    unit: null
    range: ">= 1 line"
    default: null
    doc: >-
      The mzML runs, one per line, tab-separated: path[TAB condition[TAB biorep[TAB techrep[TAB
      fraction]]]]. Blank lines are ignored. Omitted fields default as MetaMorpheus does with no
      design: condition "", biorep = the line's 0-based index, techrep 0, fraction 0. Replicate and
      fraction numbers are non-negative integers. Base names must be unique.
  - {name: normalize, type: flag, required: false, unit: null, range: null, default: false, doc: "Normalize intensities across runs (FlashLFQ Normalize)."}
  - {name: ppm, type: float, required: false, unit: ppm, range: "> 0", default: 10.0, doc: "Mass tolerance for MS1 peak-finding (PpmTolerance), in ppm."}
  - {name: isotope-ppm, type: float, required: false, unit: ppm, range: "> 0", default: 5.0, doc: "Mass tolerance for isotope-envelope matching (IsotopePpmTolerance), in ppm."}
  - {name: integrate, type: flag, required: false, unit: null, range: null, default: false, doc: "Integrate peak area instead of taking the apex intensity (Integrate). FlashLFQ recommends off."}
  - {name: mbr, type: flag, required: false, unit: null, range: null, default: false, doc: "Match-between-runs: quantify a peptide in a run where it was not identified by transferring the identification (MatchBetweenRuns). Needs a complete, balanced design."}
  - {name: mbr-ppm, type: float, required: false, unit: ppm, range: "> 0", default: 10.0, doc: "Mass tolerance for MBR transfers (MbrPpmTolerance), in ppm."}
  - {name: mbr-q, type: float, required: false, unit: q-value, range: "0 to 1", default: 0.05, doc: "q-value below which an MBR transfer is accepted (MbrQValueThreshold)."}
  - {name: shared-peptides, type: flag, required: false, unit: null, range: null, default: false, doc: "Let peptides shared between protein groups contribute to protein quant (UseSharedPeptidesForProteinQuant)."}
  - {name: bayesian, type: flag, required: false, unit: null, range: null, default: false, doc: "Also run FlashLFQ's Bayesian protein fold-change engine (BayesianProteinQuant). Its results are not on the wire; they reach only out's BayesianProteinQuant.tsv."}
  - {name: use-pep-q, type: flag, required: false, unit: null, range: null, default: false, doc: "Store each identification's PEP q-value as its q-value instead of its q-value (MakeIdentifications usePepQValue). It filters nothing here: it changes the value FlashLFQ's own q-value thresholds (e.g. MBR donor selection) later read. For a DIA-NN report the stored value is the raw PEP, not a q-value."}
  - name: threads
    type: int
    required: false
    unit: threads
    range: "any integer; -1 means one fewer than the logical cores"
    default: -1
    doc: >-
      FlashLFQ MaxThreads. mzLib resolves it in the engine constructor: -1, or any value >= the
      core count, becomes (cores - 1); anything that leaves <= 0 becomes 1. parameters.max_threads
      echoes the RESOLVED value, so it depends on the machine. The answer does not depend on it (see
      caveats).
  - {name: out, type: path, required: false, unit: null, range: null, default: null, doc: "Directory (created if absent) where FlashLFQ also writes QuantifiedPeaks.tsv, QuantifiedPeptides.tsv, QuantifiedProteins.tsv and, with bayesian, BayesianProteinQuant.tsv. Absent or blank writes nothing."}

result:
  envelope_fields:
    - {wire: psm_file, type: string, unit: null, nullable: false, null_means: null, doc: "Absolute path of the PSM file."}
    - {wire: identification_count, type: int, unit: identifications, nullable: false, null_means: null, doc: "Identifications FlashLFQ was given: every record in the PSM file, unfiltered. MakeIdentifications applies no q-value filter; it skips only records whose run was not supplied, which the bridge rejects up front. Decoys are included (with useForProteinQuant false)."}
    - {wire: parameters, type: object, unit: null, nullable: false, null_means: null, doc: "The FlashLFQ parameters used, by mzLib name: normalize, ppm_tolerance (ppm), isotope_ppm_tolerance (ppm), integrate, match_between_runs, mbr_ppm_tolerance (ppm), mbr_q_value_threshold (q-value), use_shared_peptides_for_protein_quant, bayesian_protein_quant, max_threads (the resolved thread count)."}
    - {wire: spectra_files, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per stdin line, in stdin order; fields under result.tables.spectra_files."}
    - {wire: peptide_count, type: int, unit: peptides, nullable: false, null_means: null, doc: "Entries in peptides: distinct modified sequences quantified."}
    - {wire: protein_count, type: int, unit: protein groups, nullable: false, null_means: null, doc: "Entries in proteins."}
    - {wire: peptides, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per modified sequence, mirroring QuantifiedPeptides.tsv; fields under result.tables.peptides."}
    - {wire: proteins, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per protein group, mirroring QuantifiedProteins.tsv; fields under result.tables.proteins."}
    - {wire: peaks, type: "object[]", unit: null, nullable: false, null_means: null, doc: "Every chromatographic peak, run by run in stdin order, mirroring QuantifiedPeaks.tsv; fields under result.tables.peaks. The complete surface for match-between-runs."}
    - {wire: output_directory, type: string, unit: null, nullable: true, null_means: "out was not given (or was blank): no files were written", doc: "Absolute path of out."}
  # No single row table: the four lists are typed under result.tables (not validated by
  # tools/check_verbs.py, like proteins.read's tables).
  columns: []
  tables:
    spectra_files:
      - {wire: file_name, type: string, unit: null, nullable: false, null_means: null, doc: "Run base name (no directory or extension): the key of every intensities map."}
      - {wire: full_path, type: string, unit: null, nullable: false, null_means: null, doc: "The mzML path as given on stdin."}
      - {wire: condition, type: string, unit: null, nullable: false, null_means: null, doc: "Sample-group label; \"\" when none was given."}
      - {wire: biological_replicate, type: int, unit: null, nullable: false, null_means: null, doc: "0-based."}
      - {wire: technical_replicate, type: int, unit: null, nullable: false, null_means: null, doc: "0-based."}
      - {wire: fraction, type: int, unit: null, nullable: false, null_means: null, doc: "0-based."}
      - {wire: peak_count, type: int, unit: peaks, nullable: false, null_means: null, doc: "Chromatographic peaks quantified in this run."}
      - {wire: mbr_peak_count, type: int, unit: peaks, nullable: false, null_means: null, doc: "Of those, peaks with detection type MBR (transferred into this run). 0 unless mbr."}
    peptides:
      - {wire: sequence, type: string, unit: null, nullable: false, null_means: null, doc: "Full modified sequence as FlashLFQ renders it: the quantified identity."}
      - {wire: base_sequence, type: string, unit: null, nullable: false, null_means: null, doc: "Bare residues."}
      - {wire: protein_groups, type: string, unit: null, nullable: false, null_means: null, doc: "Protein group names, ';'-joined, distinct."}
      - {wire: intensities, type: "map<string,float>", unit: "intensity (instrument units)", nullable: false, null_means: null, doc: "Run base name -> intensity; 0 means not quantified in that run. A value is null only if FlashLFQ produced a non-finite number (the bindings read it as 0). Where a peptide has several peaks in a run this is ONE of them, not their sum."}
      - {wire: detection_types, type: "map<string,string>", unit: null, nullable: false, null_means: null, doc: "Run base name -> FlashLFQ DetectionType name: MSMS, MBR, MSMSIdentifiedButNotQuantified, MSMSAmbiguousPeakfinding, NotDetected, ..."}
    proteins:
      - {wire: protein_group, type: string, unit: null, nullable: false, null_means: null, doc: "Protein group name."}
      - {wire: gene_name, type: string, unit: null, nullable: false, null_means: null, doc: "As the PSM file gave it; may be \"\"."}
      - {wire: organism, type: string, unit: null, nullable: false, null_means: null, doc: "As the PSM file gave it; may be \"\"."}
      - {wire: intensities, type: "map<string,float>", unit: "intensity (instrument units)", nullable: false, null_means: null, doc: "Run base name -> protein intensity. A value is null when median polish could not resolve one (NaN: a degenerate peptide matrix, e.g. too few peptides per run); 0 means not measured. Keyed per run even when a design groups runs into samples."}
    peaks:
      - {wire: file_name, type: string, unit: null, nullable: false, null_means: null, doc: "Run base name."}
      - {wire: base_sequence, type: string, unit: null, nullable: false, null_means: null, doc: "Of the peak's first identification; \"\" if it has none."}
      - {wire: sequence, type: string, unit: null, nullable: false, null_means: null, doc: "Modified sequence of the first identification; \"\" if none."}
      - {wire: intensity, type: float, unit: "intensity (instrument units)", nullable: true, null_means: "FlashLFQ produced a non-finite intensity for the peak", doc: "Apex intensity, or the integrated area under integrate."}
      - {wire: detection_type, type: string, unit: null, nullable: false, null_means: null, doc: "DetectionType name; MBR marks a transferred peak."}
      - {wire: retention_time, type: float, unit: min, nullable: true, null_means: "the peak has no apex (or its time is non-finite)", doc: "Apex retention time."}
      - {wire: num_identifications, type: int, unit: identifications, nullable: false, null_means: null, doc: "Identifications that explain the peak; > 1 means ambiguous."}
      - {wire: protein_groups, type: string, unit: null, nullable: false, null_means: null, doc: "Protein groups of all its identifications, ';'-joined, distinct."}

errors:
  - {kind: usage, when: "psms missing or blank; the PSM file not found; nothing on stdin; a stdin line with no path; a run that is not .mzML; an mzML not found; two runs sharing a base name; a design field that is not a non-negative integer"}
  - {kind: usage, when: "the PSM file names runs with no mzML on stdin (checked before any spectra are read; the message lists up to five); ppm, isotope-ppm, mbr-ppm or mbr-q not a number; threads not an integer"}
  - {kind: correctness, when: "the PSM file is of a type mzLib cannot read as quantifiable results (MzLibException), or is malformed; an mzML fails to parse; the FlashLFQ engine fails"}
  - {kind: service_unavailable, when: never}

caveats:
  - "Since mzLib 1.0.595 (#1422), normalize and bayesian walk the biological replicates that exist, not 0 to the largest number, and normalize takes the first condition's lowest biorep and each fraction's lowest techrep as its reference, with techreps in numeric order. A design numbered from 1 is now normalized (before, biorep normalization silently did nothing); a gapped design with fractions, which threw, now quantifies; a replicate sharing no peptide with the reference no longer stops the rest of the step. Omitted bioreps are numbered by line across all conditions, so every condition after the first has a gap; that is handled the same way."
  - "Since mzLib 1.0.595 (#1424), condition A1 biorep 0 beside condition A biorep 10 quantifies: median polish keyed its samples by the two joined as one string, which threw IndexOutOfRangeException and crossed as correctness."
  - "The thread count does not change the answer. mzLib#1111 (the peptide roll-up dropping MBR intensities nondeterministically at MaxThreads -1) was fixed by mzLib#1155, which builds the PEP training rows in a fixed order; mzLib's TestMbrDeterminism checks the K562 pair at -1 on every PR. Re-measured through the bridge on 2026-10-30 (pyMzLib 0.7.0, mzLib 1.0.596): five runs at -1 and one at 1 gave byte-identical QuantifiedPeaks, Peptides and Proteins.tsv (140 MBR peaks) and identical returned results. On a pair this small, 1 thread was a little faster (about 11 s against 14.5 s)."
  - "mzML only: .raw and .d are rejected up front; convert them first."
  - "For match-between-runs read peaks, not peptides: the peptide roll-up (as in QuantifiedPeptides.tsv) reports far fewer MBR transfers than happened (K562 pair: 140 MBR peaks, 52 MBR peptide entries)."
  - "Peptide intensity 0 means not quantified; protein intensity null means unquantifiable. Neither is a measured zero."
  - "Only FlashLFQ settings listed here are reachable; the rest (isotopes required, MBR RT window, donor criterion, IsoTracker, Bayesian sampling) run at mzLib's defaults."
  - "stdout carries only the envelope: the engine's console output is redirected to stderr for the run."

bindings:
  py: {name: pymzlib.flashlfq.quantify}
  rust: {name: "mzlib::flashlfq::quantify_with", options: QuantifyOptions}
  r: {name: flashlfq_quantify}

examples:
  - fixture: flashlfq_small.json
    py: "result = pymzlib.flashlfq.quantify('AllPSMs.psmtsv', ['run_3.mzML', 'run_4.mzML'], match_between_runs=True, max_threads=1)"
    rust: "let result = mzlib::flashlfq::quantify_with(\"AllPSMs.psmtsv\", &[SpectraFile::from(\"run_3.mzML\"), SpectraFile::from(\"run_4.mzML\")], &QuantifyOptions { match_between_runs: true, max_threads: 1, ..Default::default() })?;"
    r: "result <- flashlfq_quantify('AllPSMs.psmtsv', c('run_3.mzML', 'run_4.mzML'), match_between_runs = TRUE, max_threads = 1)"

open_questions:
  - "An omitted biorep is the line's 0-based index across all lines, the convention MetaMorpheus uses for a run with no design. It is the bridge's own default: mzLib has no reader that says what a run without a design is (MetaMorpheus's ExperimentalDesign reader lives in MetaMorpheus). If mzLib gains one, the bridge should use it and send nothing for an omitted field."
  - "flashlfq_small.json is hand-shaped (paths '/abs/...', 4 identifications), not recorded from a live bridge; a live recording would make the example executable against real files."
  - "ppm tolerances and mbr-q are not range-checked by the bridge (a negative or zero tolerance reaches FlashLFQ); the ranges above are FlashLFQ's meaningful ones, not enforced ones. An option given with no value is silently defaulted by the Arguments parser."
  - "A PSM file of an unsupported or non-quantifiable type crosses as correctness (mzLib's MzLibException from FileReader.ReadQuantifiableResultFile), though it is arguably the caller's mistake."
