# Written 2026-09-24 with the C1 readers batch, from pyMzLib pkg/bridge/Reading*.cs on branch
# feat/readers-bulk-1.0.592 (stacked on pyMzLib#61/#62), mzLib pin 23c2490e (tag 1.0.592). Every
# example fixture was recorded from the live bridge on that branch.
verb: readers read-matches
module: readers
summary: >-
  Read identifications through the cross-format spectral_match view - scan, sequences, accession, decoy flag, modifications and the q-value, rank and threshold a format records - optionally with each engine's scores as long rows.
since: {protocol: 1, pymzlib: "0.1.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: ISpectralMatch, path: mzLib/Readers/BaseClasses/ISpectralMatch.cs, pin: 23c2490e}
  - {symbol: MzIdentMLResultFile.SkippedMatches, path: mzLib/Readers/ExternalResults/ResultFiles/MzIdentMLResultFile.cs, pin: 23c2490e}
  - {symbol: MzIdentMLRecord.Scores, path: mzLib/Readers/ExternalResults/IndividualResultRecords/MzIdentMLRecord.cs, pin: 23c2490e}
cite: []

params:
  - {name: path, type: "path", required: true, unit: null, range: null, default: null, doc: "An MsPathFinderT _IcTarget/_IcDecoy/_IcTda.tsv, a Casanovo .mztab, or an mzIdentML .mzid / .mzid.gz."}
  - {name: offset, type: "int", required: false, unit: "matches", range: ">= 0", default: 0, doc: "Skip this many matches. A window, not a cursor: mzLib parses the whole file on every call, so paging re-reads it."}
  - {name: limit, type: "int", required: false, unit: "matches", range: ">= 0", default: null, doc: "Return at most this many matches. Absent means no limit; there is deliberately no default cap."}
  - {name: scores, type: "flag", required: false, unit: null, range: null, default: false, doc: "Make the table long by score: one row per match and engine score, adding match_index, score_name and score_value. Only mzIdentML records scores (#1306); other formats keep one row per match with the two columns in absent_fields. offset and limit still count matches."}
  - {name: out, type: "path", required: false, unit: null, range: null, default: null, doc: "Write the table to this path as tab-separated text instead of returning columns. Must differ from path. Parent directories are created."}

result:
  envelope_fields:
    - {wire: path, type: "string", unit: null, nullable: false, null_means: null, doc: "Absolute path of the input."}
    - {wire: file_type, type: "string", unit: null, nullable: false, null_means: null, doc: "The mzLib SupportedFileType that was dispatched."}
    - {wire: reader, type: "string", unit: null, nullable: false, null_means: null, doc: "The mzLib reader class that parsed the file."}
    - {wire: skipped_count, type: "int", unit: "items", nullable: true, null_means: "the format keeps no skip list (every format but mzIdentML)", doc: "mzIdentML items mzLib did not represent (crosslinks, unresolvable modifications, substitutions); record_count + skipped_count is the items in the file (#1313)."}
    - {wire: skipped, type: "object[]", unit: null, nullable: true, null_means: "as skipped_count", doc: "{spectrum_identification_item_id, spectrum_id, reason} per skipped item."}
    - {wire: record_count, type: "int", unit: "matches", nullable: false, null_means: null, doc: "Matches in the whole file, before the window."}
    - {wire: rows_not_read, type: "int", unit: "rows", nullable: true, null_means: "never counted for this view", doc: "Data rows that did not become records."}
    - {wire: retention_time_unit, type: "string", unit: null, nullable: true, null_means: "the view has no time column", doc: "Always null for this view."}
    - {wire: caveats, type: "string[]", unit: null, nullable: false, null_means: null, doc: "What this view cannot be trusted to mean for THIS file, each citing the mzLib source."}
    - {wire: column_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Column order."}
    - {wire: absent_fields, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Columns the view defines that this file's format has no column or source for; null in every row (BULK.md section 4). Empty when every column has a source."}
    - {wire: failed_fields, type: "string[]", unit: null, nullable: false, null_means: null, doc: "'field: ExceptionType' for each column whose read threw on some returned rows; those cells are null."}
    - {wire: excluded_fields, type: "object[]", unit: null, nullable: false, null_means: null, doc: "{field, type, reason, verb} for each field with no column shape; verb names the command that carries it, or null."}
    - {wire: error, type: "object", unit: null, nullable: true, null_means: "always, for a single path: a file that cannot be read fails the call instead", doc: "{kind, type, message}; non-null only in a files[] entry under on-error skip."}
    - {wire: scores_included, type: "bool", unit: null, nullable: false, null_means: null, doc: "Whether --scores made the table long by score."}
    - {wire: returned_count, type: "int", unit: "matches", nullable: false, null_means: null, doc: "Matches returned in columns (the unit offset and limit count in); 0 when written to out."}
    - {wire: row_count, type: "int", unit: "rows", nullable: false, null_means: null, doc: "Rows in columns: more than returned_count in a long table, where one record gives several rows; 0 when written to out."}
    - {wire: offset, type: "int", unit: "matches", nullable: false, null_means: null, doc: "The offset applied, in matches."}
    - {wire: truncated, type: "bool", unit: null, nullable: false, null_means: null, doc: "True whenever records were left out by offset or limit."}
    - {wire: columns, type: "table", unit: null, nullable: true, null_means: "the table was written to out instead", doc: "Column name to per-row values, in column_names order."}
    - {wire: output, type: "object", unit: null, nullable: true, null_means: "out was not given", doc: "{path, format: \"tsv\", row_count} when out was given."}
  columns:
    - {wire: source_index, type: "int", unit: null, nullable: false, null_means: null, present_when: "--paths-stdin", doc: "0-based position of the row's input in the stdin list."}
    - {wire: source_path, type: "string", unit: null, nullable: false, null_means: null, present_when: "--paths-stdin", doc: "Absolute path of the row's input."}
    - {wire: file_name_without_extension, type: "string", unit: null, nullable: false, null_means: null, doc: "The spectra file of the match."}
    - {wire: one_based_scan_number, type: "int", unit: null, nullable: false, null_means: null, doc: "Scan number; see caveats for mzIdentML index= and Casanovo."}
    - {wire: base_sequence, type: "string", unit: null, nullable: false, null_means: null, doc: "Unmodified sequence."}
    - {wire: full_sequence, type: "string", unit: null, nullable: false, null_means: null, doc: "Modified sequence."}
    - {wire: accession, type: "string", unit: null, nullable: true, null_means: "the property threw (then in failed_fields)", doc: "Protein accession(s)."}
    - {wire: is_decoy, type: "bool", unit: null, nullable: true, null_means: "every format but MsPathFinderT (then in absent_fields)", doc: "Decoy flag."}
    - {wire: modifications, type: "string", unit: null, nullable: false, null_means: null, doc: "'position:name' pairs, ';'-joined, 1 = N-terminus."}
    - {wire: modification_count, type: "int", unit: null, nullable: false, null_means: null, doc: "Modifications on the match."}
    - {wire: q_value, type: "float", unit: "fraction (0 to 1)", nullable: true, null_means: "the format has no q-value (in absent_fields) or this mzIdentML item reports none", doc: "PSM-level q-value (mzIdentML MS:1002354 or a child; MsPathFinderT QValue)."}
    - {wire: rank, type: "int", unit: null, nullable: true, null_means: "not mzIdentML (in absent_fields)", doc: "The item's rank; filter on rank == 1."}
    - {wire: pass_threshold, type: "bool", unit: null, nullable: true, null_means: "not mzIdentML (in absent_fields)", doc: "The item's passThreshold."}
    - {wire: match_index, type: "int", unit: null, nullable: false, null_means: null, present_when: "scores", doc: "0-based position of the match among the file's matches."}
    - {wire: score_name, type: "string", unit: null, nullable: true, null_means: "the match has no scores, or the format records none (in absent_fields)", present_when: "scores", doc: "Engine score name as written, e.g. MS-GF:SpecEValue."}
    - {wire: score_value, type: "float", unit: "engine-defined (see score_name)", nullable: true, null_means: "as score_name", present_when: "scores", doc: "The score's value."}
  # The --paths-stdin shape (design/BULK.md). Examples marked shape: bulk are checked against it.
  bulk:
    params:
      - {name: paths-stdin, type: "flag", required: false, unit: null, range: null, default: null, doc: "Read MANY files: newline-delimited paths on stdin (blank lines ignored; a repeated path is a usage error). Exclusive with path; offset and limit are refused with it."}
      - {name: threads, type: "int", required: false, unit: "files", range: ">= 1, or -1 for one per core", default: 1, doc: "Files read at once. The output is byte-identical at any value (files are emitted in input order); 1 is the default because each file in flight is held whole in memory."}
      - {name: on-error, type: "string", required: false, unit: null, range: "fail | skip", default: "fail", doc: "fail: the first unreadable input stops the batch with its usage or correctness error, the message starting 'Input <i> (<path>)'. skip: the failure goes in that input's files[i].error and the rest are read. skip with a single path is a usage error."}
      - {name: out, type: "path", required: false, unit: null, range: null, default: null, doc: "Write the long table here, one file at a time in input order, so memory holds at most threads files. A batch that stops on an error deletes its partial table. Must differ from every input."}
    envelope_fields:
      - {wire: file_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Paths given."}
      - {wire: read_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Files read."}
      - {wire: failed_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Files not read; non-zero only under on-error skip."}
      - {wire: record_count, type: "int", unit: "matches", nullable: false, null_means: null, doc: "Matches summed over the files read (BULK.md section 2)."}
      - {wire: returned_count, type: "int", unit: "matches", nullable: false, null_means: null, doc: "Matches returned in columns, summed over the files; 0 when written to out."}
      - {wire: row_count, type: "int", unit: "rows", nullable: false, null_means: null, doc: "Rows in columns (more than returned_count for a long view); 0 when written to out."}
      - {wire: on_error, type: "string", unit: null, nullable: false, null_means: null, doc: "fail or skip, as requested. --threads is deliberately not echoed: the envelope is byte-identical at every thread count."}
      - {wire: scores_included, type: "bool", unit: null, nullable: false, null_means: null, doc: "Whether --scores was given."}
      - {wire: column_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "source_index, source_path, then the single-file columns."}
      - {wire: columns, type: "table", unit: null, nullable: true, null_means: "the table was written to out instead", doc: "One long table: rows grouped by input in input order, each file's rows in its own order, whatever --threads is."}
      - {wire: output, type: "object", unit: null, nullable: true, null_means: "out was not given", doc: "{path, format: \"tsv\", row_count}; written one file at a time."}
      - {wire: files, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per input, in input order: the per-file block (path, file_type, reader, skipped_count, skipped, record_count, rows_not_read, retention_time_unit, caveats, column_names, absent_fields, failed_fields, excluded_fields, error). An unread input has error set and every fact it could not establish null or empty."}

errors:
  - {kind: usage, when: "path missing or blank; file or directory not found; mzLib does not recognise the file type (the message points at readers formats)"}
  - {kind: usage, when: "offset, limit or out given with no value; offset or limit < 0; non-integer value; out resolves to the same file as path"}
  - {kind: usage, when: "the file has no spectral_match view"}
  - {kind: correctness, when: "mzLib recognises the file and fails to parse it"}
  - {kind: usage, when: "paths-stdin with path, offset or limit; paths-stdin with a value; no paths on stdin; a repeated path; threads 0 or below -1; on-error not fail or skip; on-error skip with a single path; out naming an input"}
  - {kind: usage, when: "with on-error fail, an input that is missing or not this view: the usage error of that input, prefixed 'Input <i> (<path>)'"}
  - {kind: correctness, when: "with on-error fail, mzLib failing to parse an input: that input's own error type, message prefixed 'Input <i> (<path>)'"}
  - {kind: service_unavailable, when: never}

caveats:
  - "Nothing is FDR-filtered. q_value is filled only by mzIdentML and an MsPathFinderT file with a QValue column; an _IcTarget/_IcDecoy file has none and names it absent (mzLib would report 0)."
  - "mzIdentML: every SpectrumIdentificationItem is a row, lower ranks and failed thresholds included (MzIdentMLResultFile.cs:177). Filter on rank == 1 and pass_threshold."
  - "mzIdentML: is_decoy is absent because the isDecoy attribute defaults to false when omitted (MzIdentMLResultFile.cs:173)."
  - "mzIdentML: items mzLib cannot represent are skipped, not failed, and listed in skipped (MzIdentMLResultFile.cs:123)."
  - "MsPathFinderT: is_decoy comes from an XXX protein-name prefix (MsPathFinderTResult.cs:92); accession assumes a UniProt header and lands in failed_fields otherwise."
  - "Casanovo: one_based_scan_number is the mzTab index plus one (CasanovoMzTabFile.cs:116)."
  - "Many files: --paths-stdin reads the list in ONE process, --threads at a time, into one long table with source_index and source_path first. The output does not depend on --threads (a tested property); the default of 1 is a memory choice, since every reader materialises the whole file."

bindings:
  py: {name: pymzlib.readers.read_matches, bulk: pymzlib.readers.read_matches_many}
  rust: {name: "mzlib::readers::read_matches_with", bulk: "mzlib::readers::read_matches_many", options: MatchOptions}
  r: {name: readers_read_matches, bulk: readers_read_matches_many}

examples:
  - fixture: readers_matches_mzid.json
    py: "result = pymzlib.readers.read_matches('PXD078927_msgf_1_1_0.mzid', limit=3)"
    rust: "let result = mzlib::readers::read_matches_with(path, &MatchOptions { read: ReadOptions { limit: Some(3), ..Default::default() }, ..Default::default() })?;"
    r: "result <- readers_read_matches(path, limit = 3)"

open_questions:
  - "The _many spellings (py, rust, r) follow the 2026-09-23 cross-binding decision; Rust and R names here are intended, not yet ported, and since.pymzlib stays null until release."
  - "readers_matches_mzid_scores.json (--scores) is replayed through the pyMzLib conftest rather than listed here: check_verbs.py excludes present_when columns from its column check, so a --scores fixture cannot be a spec example yet."
  - "q_value, rank and pass_threshold join a view whose other columns are Readers.ISpectralMatch members; they are read from the record types that carry them. If mzLib adds them to the interface, the per-format reads go away."
