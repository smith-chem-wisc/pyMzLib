# Written 2026-10-21 with the verb, from pyMzLib pkg/bridge/Statistics.FitLogistic.cs (FitLogistic,
# LogisticFitStatuses, LogisticCaveats) and Statistics.cs (ReadResponses, ReadDesign,
# CheckTestedCoefficients, MzLibRefusal) on branch feat/stats-models (off main 50b4340), mzLib pin
# d10017ce (tag 1.0.595; LogisticRegression is from #1367, first in 1.0.594). Example fixtures
# recorded from the live bridge on that branch. stats_fit_logistic_glm.json is mzLib's own glm
# reference input (Test/StatisticalModels/ReferenceData/glm_responses.tsv and glm_design.tsv, with
# feature ids and sample names added; simulated by make_glm_lmm_fixtures.R, seed 20260924), and
# agreement with R 4.6.1's glm(family = binomial) is held through the wire by
# StatisticsTests.FitLogistic_ReproducesRsGlm_ThroughTheWire. stats_fit_logistic_malat.json is real
# data: whether FlashLFQ measured each oligo of the MALAT1 dilution series stats fit's example uses
# (malat_dilution_detected.tsv, derived by the rule in
# StatisticsTests.LogisticFixtures_AreMzLibsGlmReference_AndTheDilutionSeriesDetection).
# The status values are read from LogisticRegression.FitOne at d10017ce: mzLib does not yet say which
# FeatureFitStatus values each model returns (mzLib#1487 asks it to).
verb: stats fit-logistic
module: stats
summary: >-
  Fit one logistic regression per feature of a 0/1 feature-by-sample table, such as a detection
  table, and test each named coefficient with a Wald z.
since: {protocol: 1, pymzlib: "0.6.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: LogisticRegression.Fit, path: mzLib/StatisticalModels/LogisticRegression.cs, pin: d10017ce}
  - {symbol: LogisticModelFit, path: mzLib/StatisticalModels/LogisticRegression.cs, pin: d10017ce}
  - {symbol: LogisticRegression.SeparationThreshold, path: mzLib/StatisticalModels/LogisticRegression.cs, pin: d10017ce}
  - {symbol: FeatureFitStatus, path: mzLib/StatisticalModels/LinearModel.cs, pin: d10017ce}
cite:
  - {doi: "10.2307/2344614", for: "generalized linear models and their fitting by iteratively reweighted least squares, the estimator mzLib implements (Nelder and Wedderburn, J R Stat Soc A 135:370, 1972)"}
  - {doi: "10.1093/biomet/71.1.1", for: "separation: when the outcomes are split by the design the maximum-likelihood estimate does not exist, which is the separated status (Albert and Anderson, Biometrika 71:1, 1984)"}

params:
  - name: responses
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      stats fit's responses table, with outcomes for cells. A TSV with a header row: the first
      column is the feature id (unique, any header) and every other column is one sample, named by
      its header. Every cell is 0, 1, or blank, NA or NaN (any case) for missing, which is omitted
      from that feature's fit. mzLib refuses any other value (a proportion is not a binary
      outcome); the refusal names the feature and sample. A 0 is an outcome, not a missing value.
      Blank lines are skipped.
  - name: design
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      stats fit's design table. A TSV with a header row and one row per sample: the sample name,
      matching the responses header exactly (rows are matched by name, in any order), then one
      column per coefficient, every cell a finite number. Used as written: include an intercept
      column if you want one. mzLib refuses a design that is not of full column rank over all
      samples.
  - name: stdin
    type: "string[]"
    required: true
    unit: null
    range: ">= 1 line; each a design column name, none repeated"
    default: null
    doc: >-
      The coefficients to report, one design column name per line. The model always fits every
      design column; the table holds one block of rows per coefficient named here, in this order.
  - name: max-iterations
    type: int
    required: false
    unit: iterations
    range: ">= 1 (mzLib's rule; anything else is mzLib's refusal, a usage error)"
    default: null
    doc: >-
      The iteratively reweighted least squares iteration limit per feature (LogisticRegression.Fit
      maxIterations). A feature still changing at the limit is not_converged. Absent, the bridge
      sends none and mzLib's default applies (100 at d10017ce), and the envelope's max_iterations
      is null.
  - name: tolerance
    type: float
    required: false
    unit: "relative change in deviance (unitless)"
    range: "> 0 (mzLib's rule; anything else is mzLib's refusal, a usage error)"
    default: null
    doc: >-
      Convergence rule (LogisticRegression.Fit tolerance): iteration stops when |dev - dev_prev| /
      (|dev| + 0.1) is below it, R glm's rule. Absent, the bridge sends none and mzLib's default
      applies (1e-12 at d10017ce, tighter than glm's default epsilon of 1e-8), and the envelope's
      tolerance is null.
  - {name: threads, type: int, required: false, unit: threads, range: ">= 1, or -1 for every core", default: 1, doc: "Features fitted at once. The bridge default is 1 (BULK.md); mzLib's own default is -1. Results are identical at any value (mzLib)."}

result:
  envelope_fields:
    - {wire: responses_file, type: string, unit: null, nullable: false, null_means: null, doc: "Absolute path of the responses table."}
    - {wire: design_file, type: string, unit: null, nullable: false, null_means: null, doc: "Absolute path of the design table."}
    - {wire: feature_count, type: int, unit: features, nullable: false, null_means: null, doc: "Feature rows read."}
    - {wire: sample_count, type: int, unit: samples, nullable: false, null_means: null, doc: "Sample columns read."}
    - {wire: sample_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "In responses header order, which is the order the design rows were put in."}
    - {wire: coefficient_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Every design column, in order."}
    - {wire: tested_coefficients, type: "string[]", unit: null, nullable: false, null_means: null, doc: "The stdin coefficients, in order; the table holds one block of feature_count rows per entry."}
    - {wire: max_iterations, type: int, unit: iterations, nullable: true, null_means: "not given: mzLib's default was used (100 at d10017ce)", doc: "The iteration limit sent to mzLib."}
    - {wire: tolerance, type: float, unit: "relative change in deviance (unitless)", nullable: true, null_means: "not given: mzLib's default was used (1e-12 at d10017ce)", doc: "The convergence tolerance sent to mzLib."}
    - {wire: threads, type: int, unit: threads, nullable: false, null_means: null, doc: "The thread count used."}
    - {wire: missing_count, type: int, unit: cells, nullable: false, null_means: null, doc: "Response cells that were blank, NA or NaN."}
    - {wire: status_counts, type: "map<string,int>", unit: features, nullable: false, null_means: null, doc: "Features per status, always these five keys: fitted, too_few_observations, rank_deficient, separated, not_converged. They are the outcomes LogisticRegression.Fit's body can return at d10017ce; a stop-gap until mzLib says per model (mzLib#1487)."}
    - {wire: row_count, type: int, unit: rows, nullable: false, null_means: null, doc: "feature_count x the number of tested coefficients."}
    - {wire: column_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "The table's columns, in order."}
    - {wire: columns, type: table, unit: null, nullable: false, null_means: null, doc: "One row per (tested coefficient, feature): coefficient blocks in stdin order, features in file order."}
    - {wire: caveats, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Four static caveats, plus one with the counts when any feature was not fitted."}
  columns:
    - {wire: feature, type: string, unit: null, nullable: false, null_means: null, doc: "The feature id from the responses file's first column."}
    - {wire: coefficient, type: string, unit: null, nullable: false, null_means: null, doc: "The coefficient this row reports."}
    - {wire: status, type: string, unit: null, nullable: false, null_means: null, doc: "fitted | too_few_observations (no more observed samples than coefficients) | rank_deficient (the design restricted to the observed samples is not of full rank) | separated (the observed outcomes are all 0, all 1, or split by the design, so no finite maximum-likelihood estimate exists; mzLib calls a fit separated when a fitted probability comes within LogisticRegression.SeparationThreshold, 1e-10 at d10017ce, of 0 or 1) | not_converged (still changing at max-iterations). Only fitted rows carry statistics."}
    - {wire: estimate, type: float, unit: "log-odds per coefficient unit (the log odds ratio for a 0/1 column)", nullable: true, null_means: "status is not fitted", doc: "The maximum-likelihood coefficient on the logit scale. exp(estimate) is the odds ratio."}
    - {wire: standard_error, type: float, unit: "log-odds per coefficient unit", nullable: true, null_means: "not fitted", doc: "From the inverse Fisher information at the estimate."}
    - {wire: z, type: float, unit: "standard errors", nullable: true, null_means: "not fitted", doc: "Wald statistic, estimate / standard_error."}
    - {wire: p_value, type: float, unit: "fraction (0 to 1)", nullable: true, null_means: "not fitted", doc: "Two-sided Wald p-value against a coefficient of 0, from the standard normal. Not adjusted across features."}
    - {wire: deviance, type: float, unit: "deviance (-2 x log-likelihood, natural log)", nullable: true, null_means: "not fitted", doc: "The feature's residual deviance; the same in every coefficient block."}
    - {wire: iterations, type: int, unit: iterations, nullable: false, null_means: null, doc: "IRLS iterations used. 0 when no fit was attempted (too_few_observations, rank_deficient, or every outcome the same); max-iterations when not_converged; a separated feature that IRLS ran on reports the iterations it ran."}
    - {wire: observed, type: int, unit: samples, nullable: false, null_means: null, doc: "Samples with a 0 or 1 for this feature."}
    - {wire: events, type: int, unit: samples, nullable: false, null_means: null, doc: "Observed samples whose outcome is 1."}

errors:
  - {kind: usage, when: "responses or design missing, blank or not found; a table empty, header-only or with too few columns; a row whose field count differs from its header; an empty or repeated feature id, sample or coefficient name; a response cell that is not a number (other than blank, NA, NaN); a design cell that is not a finite number; the design's samples are not exactly the responses' sample columns (both differences are named)"}
  - {kind: usage, when: "no coefficient on stdin, one named twice, or one not in the design; --max-iterations or --tolerance without a value or not a number; --threads 0 or below -1"}
  - {kind: usage, when: "mzLib refuses the input (its ArgumentException, reclassified): a response that is not 0, 1 or missing, named by 0-based feature and sample and then by the names in the files; a design not of full column rank; --max-iterations below 1 or --tolerance not above 0"}
  - {kind: correctness, when: "never expected"}
  - {kind: service_unavailable, when: never}

caveats:
  - "Maximum likelihood by iteratively reweighted least squares, started and stopped as R's glm does; standard errors from the inverse Fisher information at the estimate; Wald z tests. mzLib matches R 4.6.1's glm(family = binomial, epsilon = 1e-14) to 1e-8 relative in coefficients and deviance and to 1e-6 relative in standard errors and p-values (summary.glm takes its weights from the step before the estimate). Wald tests are the least reliable of the likelihood tests near separation and in small samples; no likelihood-ratio test is offered."
  - "separated features carry no statistics. R's glm reports large, meaningless coefficients and a warning for them instead. A separated feature can be the strongest effect in the table (detected in every run of one condition and in none of another): read its events and observed counts. Firth's penalized likelihood (logistf), which gives finite estimates there, is not implemented."
  - "p_value is not adjusted across features. Send one coefficient's p_value column to stats adjust for Benjamini-Hochberg."
  - "A 0 is an outcome (for a detection table: measured as absent), not a missing value. Missing cells are omitted per feature, never imputed."

bindings:
  py: {name: pymzlib.stats.fit_logistic}
  rust: {name: "mzlib::stats::fit_logistic_with", options: FitLogisticOptions}
  r: {name: stats_fit_logistic}

examples:
  - fixture: stats_fit_logistic_glm.json
    py: "fit = pymzlib.stats.fit_logistic('glm_reference_responses.tsv', 'glm_reference_design.tsv', ['Intercept', 'x', 'grp'])"
    rust: "let fit = mzlib::stats::fit_logistic_with(\"glm_reference_responses.tsv\", \"glm_reference_design.tsv\", &[\"Intercept\", \"x\", \"grp\"], &FitLogisticOptions::default())?;"
    r: "fit <- stats_fit_logistic('glm_reference_responses.tsv', 'glm_reference_design.tsv', c('Intercept', 'x', 'grp'))"
  - fixture: stats_fit_logistic_malat.json
    py: "fit = pymzlib.stats.fit_logistic('malat_dilution_detected.tsv', 'malat_dilution_design.tsv', ['malat_250ng', 'malat_125ng'])"
    rust: "let fit = mzlib::stats::fit_logistic_with(\"malat_dilution_detected.tsv\", \"malat_dilution_design.tsv\", &[\"malat_250ng\", \"malat_125ng\"], &FitLogisticOptions::default())?;"
    r: "fit <- stats_fit_logistic('malat_dilution_detected.tsv', 'malat_dilution_design.tsv', c('malat_250ng', 'malat_125ng'))"

open_questions: []
