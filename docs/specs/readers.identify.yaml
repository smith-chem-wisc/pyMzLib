# Written 2026-09-24 with the C1 readers batch, from pyMzLib pkg/bridge/Reading*.cs on branch
# feat/readers-bulk-1.0.592 (stacked on pyMzLib#61/#62), mzLib pin 23c2490e (tag 1.0.592). Every
# example fixture was recorded from the live bridge on that branch.
verb: readers identify
module: readers
summary: >-
  Say what kind of file a path is - the mzLib file type, its extension, its reader and the cross-format views it offers - without parsing its contents.
since: {protocol: 1, pymzlib: "0.1.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: FileReader.ReadResultFile, path: mzLib/Readers/FileReader.cs, pin: 23c2490e}
  - {symbol: SupportedFileTypeExtensions.ParseFileType, path: mzLib/Readers/Util/SupportedFileTypes.cs, pin: 23c2490e}
cite: []

params:
  - {name: path, type: "path", required: true, unit: null, range: null, default: null, doc: "Any file (or Bruker .d directory). For many paths see the caveat on --paths-stdin."}

result:
  envelope_fields:
    - {wire: path, type: "string", unit: null, nullable: false, null_means: null, doc: "Absolute path identified."}
    - {wire: file_type, type: "string", unit: null, nullable: false, null_means: null, doc: "The mzLib SupportedFileType."}
    - {wire: extension, type: "string", unit: null, nullable: true, null_means: "mzLib maps no extension to this type", doc: "The extension mzLib dispatched on."}
    - {wire: reader, type: "string", unit: null, nullable: false, null_means: null, doc: "The mzLib reader class that would parse it."}
    - {wire: views, type: "string[]", unit: null, nullable: false, null_means: null, doc: "The cross-format views it offers; often empty."}
    - {wire: error, type: "object", unit: null, nullable: true, null_means: "always, for a single path; in a paths-stdin entry, the path was identified", doc: "{kind, type, message} for a path that failed under on-error skip."}
  columns: []
  # The --paths-stdin shape (design/BULK.md). Examples marked shape: bulk are checked against it.
  bulk:
    no_records: "identify reads no records, only what kind each file is, so a record_count would always be 0 (BULK.md section 2, amended 2026-10-30)."
    params:
      - {name: paths-stdin, type: "flag", required: false, unit: null, range: null, default: null, doc: "Identify MANY paths: newline-delimited paths on stdin (blank lines ignored; a repeated path is a usage error). Exclusive with path; offset, limit and out are refused with it."}
      - {name: threads, type: "int", required: false, unit: "files", range: ">= 1, or -1 for one per core", default: 1, doc: "Paths identified at once. The answer is identical at any value (files are reported in input order)."}
      - {name: on-error, type: "string", required: false, unit: null, range: "fail | skip", default: "fail", doc: "fail: the first path that cannot be identified stops the batch with its usage or correctness error, the message starting 'Input <i> (<path>)'. skip: the failure goes in that path's files[i].error and the rest are identified. skip with a single path is a usage error."}
    envelope_fields:
      - {wire: file_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Paths given."}
      - {wire: read_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Paths identified."}
      - {wire: failed_count, type: "int", unit: "files", nullable: false, null_means: null, doc: "Paths not identified; non-zero only under on-error skip."}
      - {wire: on_error, type: "string", unit: null, nullable: false, null_means: null, doc: "fail or skip, as requested. --threads is deliberately not echoed: the envelope is identical at every thread count."}
      - {wire: files, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per input, in input order: the single-path answer (path, file_type, extension, reader, views, error). A path not identified has error set and file_type, extension and reader null, views empty."}

errors:
  - {kind: usage, when: "path missing, blank or not found; mzLib does not recognise the file type"}
  - {kind: usage, when: "paths-stdin with path, offset or limit; paths-stdin with a value; no paths on stdin; a repeated path; threads 0 or below -1; on-error not fail or skip; on-error skip with a single path; out naming an input"}
  - {kind: usage, when: "with on-error fail, an input that is missing or not this view: the usage error of that input, prefixed 'Input <i> (<path>)'"}
  - {kind: usage, when: "out with paths-stdin: identify returns no table"}
  - {kind: correctness, when: "a .parquet that exists but cannot be opened, because another process holds it or the user may not read it: IOException or UnauthorizedAccessException from mzLib's detection (since mzLib #1478), not the not-supported usage error"}
  - {kind: service_unavailable, when: never}

caveats:
  - "Cheap but not pure: mzLib reads a bare .tsv's first line, a .txt's and a .mztab's first five, a .parquet's column schema and a .d directory's listing to dispatch them. A .parquet mzLib can open and read without the DIA-NN report columns (Precursor.Id, Stripped.Sequence, Run), or bytes that are not Parquet at all, is a usage error, 'Parquet file type not supported' (mzLib #1384). One it cannot open is an I/O error instead (#1478)."
  - "No software field: mzLib's Software property is Unspecified for everything its factory builds; file_type already names the tool."
  - "Many paths (result.bulk): there is no table and no --out, and no record_count, because nothing is read."

bindings:
  py: {name: pymzlib.readers.identify, bulk: pymzlib.readers.identify_many}  # identify_many: pyMzLib 0.2.0
  rust: {name: "mzlib::readers::identify", bulk: "mzlib::readers::identify_many"}
  r: {name: readers_identify, bulk: readers_identify_many}

examples:
  - fixture: readers_identify_mzid.json
    py: "result = pymzlib.readers.identify('PXD078927_msgf_1_1_0.mzid')"
    rust: "let result = mzlib::readers::identify(\"PXD078927_msgf_1_1_0.mzid\")?;"
    r: "result <- readers_identify('PXD078927_msgf_1_1_0.mzid')"
  - fixture: readers_many_identify.json
    shape: bulk
    py: "batch = pymzlib.readers.identify_many(['PXD078927_msgf_1_1_0.mzid', 'no-such-run.mzML'], on_error='skip')"
    rust: "let batch = mzlib::readers::identify_many(&[\"PXD078927_msgf_1_1_0.mzid\", \"no-such-run.mzML\"], &BulkOptions { on_error: OnError::Skip, ..Default::default() })?;"
    r: "batch <- readers_identify_many(c('PXD078927_msgf_1_1_0.mzid', 'no-such-run.mzML'), on_error = 'skip')"

open_questions: []
