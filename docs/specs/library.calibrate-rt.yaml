# Written 2026-10-28 with the verb, from pyMzLib pkg/bridge/Library.CalibrateRt.cs on branch
# feat/library-calibrate-rt-596 (off main 8bded50), mzLib pin cc67b7a29 (tag 1.0.596), which carries
# #1387 (IrtCalibration). The proposal this replaces is
# design/scouting/2026-10-28/inv-readers-mods.md, "Proposed verb surface" item 1; every mzLib claim was
# re-read at the pin. Two things changed from the proposal: anchors and queries are two lists split
# by a '--' line (BULK.md section 2) instead of one list whose role is read from which number is
# blank, so a missing value cannot turn an anchor into a query; and fitted_irt is carried on anchor
# rows only, since on a query it would repeat irt. --threads is left out: the bridge fits groups one
# after another and runs nothing in parallel (PARALLELISM.md: a verb exposes a thread count only when
# it parallelizes). Example fixtures recorded from the live bridge on that branch from two DIA-NN
# reports in mzLib's test data, read by readers read-records and cut to six columns
# (pkg/python/tests/fixtures/calibration/PROVENANCE.txt).
verb: library calibrate-rt
module: library
summary: >-
  Fit each run's map from retention time in minutes onto a spectral library's iRT scale from anchors
  you choose, and convert the times you send with them, in either direction.
since: {protocol: 1, pymzlib: "0.7.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: "IrtCalibration.Fit", path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: IrtCalibrationOptions, path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: IrtCalibrationKind, path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: "IrtCalibrationModel.ToIrt", path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: "IrtCalibrationModel.ToRtMinutes", path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: "IrtCalibrationModel.IsExtrapolated", path: mzLib/Chromatography/RetentionTimeCalibration/IrtCalibration.cs, pin: cc67b7a29}
  - {symbol: "Irt, RtMinutes", path: mzLib/MzLibUtil/RetentionTimeUnits.cs, pin: cc67b7a29}
cite:
  - {doi: "10.1002/pmic.201100463", for: "the iRT concept: a normalized, run-independent retention time scale that a run is mapped onto by a calibration (Escher et al., Proteomics 12:1111, 2012)"}
  - {doi: "10.1080/01621459.1979.10481038", for: "robust LOWESS with tricube local lines and bisquare reweighting at 6 x the median absolute residual, the curve IrtCalibrationKind.Lowess fits (Cleveland, J Am Stat Assoc 74:829, 1979)"}

params:
  - name: stdin
    type: "string[]"
    required: true
    unit: null
    range: ">= 1 anchor line; optionally a '--' line and query lines"
    default: null
    doc: >-
      Two lists of tab-separated lines, group, rt_minutes, irt, split by one line holding only '--'
      (BULK.md section 2). No header; blank lines are skipped; a UTF-8 BOM is dropped. ANCHORS come
      first: one (observed retention time in minutes, library iRT) pair per line; mzLib asks for the
      observed apex time of confidently identified precursors (IrtCalibration.cs:29-31), and which
      ones is the caller's choice. A blank, NA or NaN anchor value reaches mzLib as NaN, which it
      refuses. QUERIES follow the '--', if any: each gives exactly one of rt_minutes (convert to
      iRT, IrtCalibrationModel.ToIrt) or irt (convert to minutes, ToRtMinutes) and leaves the other
      blank. group is any non-empty name, typically the run; each group is fitted by its own
      IrtCalibration.Fit call on its own anchors, and its queries are converted by that fit. Groups
      are reported in order of first appearance, over both lists.
  - name: kind
    type: string
    required: false
    unit: null
    range: "linear | lowess"
    default: lowess
    doc: >-
      IrtCalibrationOptions.Kind. lowess (mzLib's default) is a robust locally weighted regression
      for a gradient that bends; linear is one straight line, fitted robustly. Absent sends nothing,
      so mzLib's default applies.
  - name: minimum-anchors
    type: int
    required: false
    unit: anchors
    range: ">= 3 (mzLib's own check)"
    default: 20
    doc: >-
      IrtCalibrationOptions.MinimumAnchors: a group with fewer anchors is refused rather than
      fitted. Absent means mzLib's default, 20 at the pin; the bridge sends no number of its own.
  - name: bandwidth
    type: float
    required: false
    unit: "fraction of anchors"
    range: "(0, 1] (mzLib's own check)"
    default: 0.3
    doc: >-
      IrtCalibrationOptions.Bandwidth, LOWESS only: the share of a group's anchors in each local
      fit (at least 3). Smaller follows the gradient more closely and noise too. Absent means
      mzLib's default, 0.3 at the pin. mzLib checks it for linear too, and does not use it there.
  - name: knots
    type: int
    required: false
    unit: points
    range: ">= 3 (mzLib's own check)"
    default: 100
    doc: >-
      IrtCalibrationOptions.Knots, LOWESS only: how many evenly spaced times between the first and
      last anchor the curve is fitted at; between them it is a straight line. Absent means mzLib's
      default, 100 at the pin.
  - name: robustness-iterations
    type: int
    required: false
    unit: iterations
    range: ">= 0 (mzLib's own check)"
    default: 3
    doc: >-
      IrtCalibrationOptions.RobustnessIterations: rounds of Tukey bisquare reweighting after the
      first fit, each downweighting anchors with large residuals. 0 keeps the first fit, which is
      already weighted from binned medians. Absent means mzLib's default, 3 at the pin.
  - name: on-error
    type: string
    required: false
    unit: null
    range: "fail | skip"
    default: fail
    doc: >-
      fail: the first group mzLib refuses (too few anchors, a non-finite one, anchors at one time
      only, or iRT that does not increase with time) stops the call with a usage error naming the
      group. skip: that group's error is set, its rows carry the times given and null for the rest,
      and the other groups are fitted. An option mzLib refuses fails the call either way.

result:
  envelope_fields:
    - {wire: kind, type: string, unit: null, nullable: false, null_means: null, doc: "linear or lowess: the kind applied, as given or mzLib's default."}
    - {wire: minimum_anchors, type: int, unit: anchors, nullable: false, null_means: null, doc: "The MinimumAnchors applied: as given, or mzLib's default."}
    - {wire: bandwidth, type: float, unit: "fraction of anchors", nullable: false, null_means: null, doc: "The Bandwidth applied: as given, or mzLib's default."}
    - {wire: knots, type: int, unit: points, nullable: false, null_means: null, doc: "The Knots applied: as given, or mzLib's default."}
    - {wire: robustness_iterations, type: int, unit: iterations, nullable: false, null_means: null, doc: "The RobustnessIterations applied: as given, or mzLib's default."}
    - {wire: on_error, type: string, unit: null, nullable: false, null_means: null, doc: "fail or skip, as requested."}
    - {wire: group_count, type: int, unit: groups, nullable: false, null_means: null, doc: "Distinct groups over both lists."}
    - {wire: fitted_count, type: int, unit: groups, nullable: false, null_means: null, doc: "Groups mzLib fitted."}
    - {wire: failed_count, type: int, unit: groups, nullable: false, null_means: null, doc: "Groups mzLib refused; non-zero only under on-error skip."}
    - {wire: anchor_count, type: int, unit: anchors, nullable: false, null_means: null, doc: "Anchor lines, over every group."}
    - {wire: query_count, type: int, unit: queries, nullable: false, null_means: null, doc: "Query lines, over every group."}
    - {wire: row_count, type: int, unit: rows, nullable: false, null_means: null, doc: "Rows in columns: anchor_count + query_count."}
    - {wire: groups, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One per group in order of first appearance: {group; kind (linear or lowess, IrtCalibrationModel.Kind; null if not fitted); anchor_count (anchors, IrtCalibrationModel.AnchorCount, or the lines sent if not fitted); query_count (queries); residual_sd (iRT units: mzLib's robust residual SD of the anchors that fit, IrtCalibrationModel.ResidualSd; null if not fitted); first_anchor_minutes and last_anchor_minutes (min: the span the map is fitted over, FirstAnchor and LastAnchor; null if not fitted); error ({kind: usage, type: the mzLib exception name, message: mzLib's message} under on-error skip, else null)}."}
    - {wire: column_names, type: "string[]", unit: null, nullable: false, null_means: null, doc: "The table's columns, in order."}
    - {wire: columns, type: table, unit: null, nullable: false, null_means: null, doc: "One row per stdin line, in input order: the anchors, then the queries."}
    - {wire: caveats, type: "string[]", unit: null, nullable: false, null_means: null, doc: "Five static caveats, plus one when any query falls outside its group's anchors (with the count), and one when any group was not fitted."}
  columns:
    - {wire: group, type: string, unit: null, nullable: false, null_means: null, doc: "As given on stdin."}
    - {wire: role, type: string, unit: null, nullable: false, null_means: null, doc: "anchor; to_irt (a query that gave rt_minutes); or to_minutes (a query that gave irt)."}
    - {wire: rt_minutes, type: float, unit: min, nullable: true, null_means: "a to_minutes query in a group that was not fitted, or an anchor sent blank or NA in one (mzLib refused it)", doc: "Retention time in this run: as given for an anchor or a to_irt query; IrtCalibrationModel.ToRtMinutes(irt) for a to_minutes query."}
    - {wire: irt, type: float, unit: iRT, nullable: true, null_means: "a to_irt query in a group that was not fitted, or an anchor sent blank or NA in one (mzLib refused it)", doc: "Indexed retention time on the anchors' library scale: as given for an anchor or a to_minutes query; IrtCalibrationModel.ToIrt(rt_minutes) for a to_irt query."}
    - {wire: fitted_irt, type: float, unit: iRT, nullable: true, null_means: "a query, whose irt is itself the converted value, or a group that was not fitted", doc: "Anchors only: the fitted map's iRT at the anchor's time, IrtCalibrationModel.ToIrt(rt_minutes). irt minus fitted_irt is the anchor's residual."}
    - {wire: is_extrapolated, type: bool, unit: null, nullable: true, null_means: "the group was not fitted", doc: "IrtCalibrationModel.IsExtrapolated(rt_minutes): the time lies before the group's first anchor or after its last, where the map is a straight-line continuation rather than a fit."}

errors:
  - {kind: usage, when: "kind given without a value or not linear or lowess; minimum-anchors, knots or robustness-iterations not an integer; bandwidth not a number; any of them given without a value; on-error not fail or skip"}
  - {kind: usage, when: "stdin has no anchor line; a line with other than 3 tab-separated fields; an empty group; a value that is not a number (other than blank, NA, NaN); a second '--' line; a query with both rt_minutes and irt, or with neither; a query value that is not finite"}
  - {kind: usage, when: "mzLib refuses an option (IrtCalibrationOptions out of range: MinimumAnchors below 3, Bandwidth outside (0, 1], Knots below 3, RobustnessIterations below 0; mzLib's ArgumentOutOfRangeException, reclassified), whatever on-error says"}
  - {kind: usage, when: "with on-error fail, mzLib refuses a group's anchors: fewer than minimum_anchors (a group with queries and no anchors included), a non-finite value, all at one time, or a fit whose iRT does not increase with time (mzLib's ArgumentException, reclassified); the message starts with the group"}
  - {kind: correctness, when: never expected}
  - {kind: service_unavailable, when: never}

caveats:
  - "iRT is the scale of the library the anchors' iRT values came from. A calibration maps one run onto that library's scale, so iRT values from two libraries are not comparable, and the same run calibrated against two libraries gives two maps."
  - "The anchors are the caller's choice: mzLib asks for the observed apex retention time, in minutes, of confidently identified precursors paired with their library iRT (IrtCalibration.cs:29-31). The bridge applies no q-value cutoff and removes no duplicate. The fit is robust to some wrong anchors (binned medians, then Tukey bisquare reweighting), not to a wrong choice of them."
  - "residual_sd is mzLib's robust residual SD, in iRT units, of the anchors that fit: residuals beyond 3 robust SDs are set aside before it is computed (IrtCalibration.InlierSd). It understates the spread when many anchors are wrong, and a LOWESS fit to few anchors can pass through nearly all of them, so a residual_sd near 0 there means an overfit, not a perfect run. irt minus fitted_irt on the anchor rows shows every residual."
  - "Outside each group's first and last anchor the map continues as a straight line, not a fit (IrtCalibrationModel.IsExtrapolated). Read is_extrapolated before trusting a converted time there."
  - "The fitted curve itself does not cross the wire: mzLib keeps its knots private and its constructor internal (IrtCalibrationModel), so a calibration cannot be returned and reused. Send the queries in the same call as their anchors; refitting the same anchors gives the same map, because mzLib sorts them first."

bindings:
  py: {name: pymzlib.library.calibrate_rt}
  rust: {name: "mzlib::library::calibrate_rt", options: RtCalibrationOptions, note: "Anchors are RtAnchor values and queries RtQuery values (ToIrt or ToMinutes), so a query cannot give both times or neither."}
  r: {name: library_calibrate_rt, note: "Anchors and queries are data.frames or lists of list(...); each query gives exactly one of rt_minutes and irt, the other NA."}

examples:
  - fixture: library_calibrate_rt_hela.json
    py: "calibration = pymzlib.library.calibrate_rt(anchors, queries)"
    rust: "let calibration = mzlib::library::calibrate_rt(&anchors, &queries, &RtCalibrationOptions::default())?;"
    r: "calibration <- library_calibrate_rt(anchors, queries)"
  - fixture: library_calibrate_rt_pbmc_skip.json
    py: "calibration = pymzlib.library.calibrate_rt(anchors, on_error='skip')"
    rust: "let calibration = mzlib::library::calibrate_rt(&anchors, &[], &RtCalibrationOptions { on_error: OnError::Skip, ..Default::default() })?;"
    r: "calibration <- library_calibrate_rt(anchors, on_error = 'skip')"
  - fixture: library_calibrate_rt_pbmc_linear.json
    py: "calibration = pymzlib.library.calibrate_rt(anchors, queries, kind='linear', minimum_anchors=10)"
    rust: "let calibration = mzlib::library::calibrate_rt(&anchors, &queries, &RtCalibrationOptions { kind: Some(\"linear\".into()), minimum_anchors: Some(10), ..Default::default() })?;"
    r: "calibration <- library_calibrate_rt(anchors, queries, kind = 'linear', minimum_anchors = 10)"

open_questions:
  - "The fitted curve cannot be returned: IrtCalibrationModel's knots and end slopes are private fields and its constructor is internal (IrtCalibration.cs:273-278). A public read-only Knots (and the two end slopes) would let the envelope carry each group's curve, at most Knots points, for plotting and for reuse without refitting (PUSH-TO-MAINLAND)."
  - "IrtCalibration.Line, the two-point line a search uses before any anchors exist, is not projected: it is useful only inside a search engine. Revisit on demand."
  - "Calibrated minutes cannot be written back into a .msl: MslLibrary.WithCalibratedRetentionTimes takes a slope and intercept, and mzLib does not route it through IrtCalibrationModel (mzLib #1387 says that is a separate PR)."
