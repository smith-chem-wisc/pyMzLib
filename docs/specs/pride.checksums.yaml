# Written 2026-10-21 with the verb (G-new-verbs-1.0.595, batch 1), from pyMzLib pkg/bridge/Program.cs
# (PrideChecksumsAsync, ToWireChecksum, ClassifyError) on branch feat/pride-checksums (off main b6a90d7,
# pyMzLib 0.5.0) and mzLib pin d10017ce (tag 1.0.595): PrideArchiveClient.GetFileChecksumsAsync and
# ParseChecksums (#1427), PrideFileChecksum, GetProjectAsync. The proposal is in
# design/scouting/2026-10-20/inv-sdrf-pride.md; two of its claims did not survive the code (see the
# caveats on pre-publication projects and the absent total). The example fixture
# pride_PXD000001_checksums.json was recorded live through that branch's bridge on 2026-10-21. The
# PXD000001 and PXD010820 comparisons in the caveats were measured the same day: the checksum list,
# the REST manifest, an HTTP HEAD, and one download (PXD010820's Maxquant_Output.zip, hashed with
# md5sum and sha1sum).
verb: pride checksums
module: pride
summary: >-
  List the MD5 and exact size PRIDE recorded for each file deposited in a project: the record a
  downloaded file is checked against.
since: {protocol: 1, pymzlib: "0.6.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: PrideArchiveClient.GetFileChecksumsAsync, path: mzLib/UsefulProteomicsDatabases/PrideArchiveClient.cs, pin: d10017ce}
  - {symbol: PrideFileChecksum, path: mzLib/UsefulProteomicsDatabases/PrideFileChecksum.cs, pin: d10017ce}
  - {symbol: PrideArchiveClient.GetProjectAsync, path: mzLib/UsefulProteomicsDatabases/PrideArchiveClient.cs, pin: d10017ce}
cite:
  - {doi: "10.1093/nar/gkae1011", for: "The PRIDE Archive, whose checksum list this verb reads (Perez-Riverol et al., The PRIDE database at 20 years: 2025 update, NAR)"}

params:
  - name: accession
    type: string
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      The project accession, e.g. PXD000001. Sent to PRIDE as given: the bridge checks only that it
      is not blank. PRIDE's checksum and project routes are case-sensitive (pxd000001 is an unknown
      accession there), so the bindings upper-case it and check its shape first.

result:
  envelope_fields:
    - {wire: accession, type: string, unit: null, nullable: false, null_means: null, doc: "The accession, echoed as given."}
    - {wire: file_count, type: int, unit: files, nullable: false, null_means: null, doc: "Entries in files. 0 means the project exists and PRIDE holds no checksum for any of its files, so nothing can be checked. It is an answer, not a not-found: PRIDE answers an unknown accession with an empty list too, so mzLib then asks for the project and fails when there is none (see errors)."}
    - {wire: files, type: "object[]", unit: null, nullable: false, null_means: null, doc: "One entry per file, sorted by file_name in ordinal order. mzLib returns a map keyed by file name, which has no order, so the bridge sorts it to send the same list the same way on every run. Fields under result.columns."}
  # Fields of each entry in `files` (a list of records, not a column dict).
  columns:
    - {wire: file_name, type: string, unit: null, nullable: false, null_means: null, doc: "The bare file name, as pride files spells file_name. Never a path. Unique in the list and case-sensitive: README.txt and readme.txt would be two files."}
    - {wire: md5, type: string, unit: null, nullable: false, null_means: null, doc: "The file's MD5 as 32 hexadecimal characters, as PRIDE wrote it. Lower case in every list seen, but not rewritten, so compare it without regard to case, as mzLib's own checks do. Not pride files' checksum, which is a different digest (see caveats)."}
    - {wire: size_bytes, type: int, unit: bytes, nullable: false, null_means: null, doc: "The file's exact size in bytes: the length a download of it comes to. A 64-bit count; raw files pass 2 GiB. Compare a downloaded file's length with this, not with pride files' file_size_bytes or pride ftp-files' approximate_size_bytes (see caveats)."}

errors:
  - {kind: usage, when: "accession missing, blank, or given without a value (checked by the bridge before mzLib)"}
  - {kind: service_unavailable, when: "the bridge's own classification (Program.ClassifyError; since mzLib 1.0.593 (#1350) PRIDE raises every transport failure as an HttpRequestException carrying the cause or the status): a timeout or cancellation, a socket failure, an HttpRequestException with no status but an inner cause (refused connection, DNS, TLS), an HTTP 408, 429 or 5xx on the checksum list or on the project lookup, or a body cut off in transit"}
  - {kind: correctness, when: "no project has that accession, or it is not yet public (MzLibException 'PRIDE Archive has no project with accession ...': PRIDE answers both with an empty list and 404 on the project; the bindings re-map this one message to their not-found error); a list mzLib cannot read (MzLibException, never retried: a header other than File-Name, File-MD5Checksum and File-Size, an empty line before the last row, a row without exactly three tab-separated fields or without a name, an MD5 that is not 32 hexadecimal characters, a size that is not a whole number of bytes, or a name listed twice); any other HTTP status on either request (e.g. 404 on the list)"}

caveats:
  - "Since mzLib 1.0.594 (#1412), PrideArchiveClient retries a transient failure, that request alone, after 5, 20 and 60 s (a 429 or 503 Retry-After of up to 60 s replaces the wait); transient means no HTTP status at all, 408, 429, any 5xx, or a 403 from ftp.pride.ebi.ac.uk, EBI's rate limit. Each attempt can take up to the client's 100 s timeout, so a service that hangs takes up to about 485 s per request before the failure is reported. An empty list costs a second request, the project lookup, with its own retries. A binding's own timeout shorter than that reports a hanging outage as a timeout, not as service_unavailable."
  - "A third list, not a view of pride files or pride ftp-files. It covers the files the submitter deposited at the project's root. PRIDE's generated/ files have no row, so a file without a row cannot be checked; that does not make it invalid. For PXD000001 on 2026-10-21 it had 12 rows for the 14 files of the FTP tree (the two missing are in generated/), and 5 of the 12 named files the REST manifest omits."
  - "It can list files that are not deposits: PXD015239's includes an NFS temp file, .nfs80360b91005fae5300002478, at 2285905384 bytes. Look up the files you have by name; do not read the list as the project's contents."
  - "PRIDE holds no checksums before publication: a project not yet public is the not-found error here, not an empty list."
  - "md5 is not pride files' checksum. That field, where PRIDE fills it in, is a 40-character SHA-1 (PXD010820's Maxquant_Output.zip, checked against the downloaded file on 2026-10-21), and for every PXD000001 file it is empty. Do not compare the two."
  - "size_bytes is the exact download length, which neither other listing gives. pride files' file_size_bytes can differ: for PXD000001's PRIDE_Exp_Complete_Ac_22134.xml.gz it is 10677205 where the download is 10668000 bytes (this list's value, and an HTTP HEAD's Content-Length on 2026-10-21), and for a .gz file it can be more than ten times larger (PXD015239's 190712-VL-BR-LFQ-1.mzid.gz, per mzLib's PrideFileChecksum). pride ftp-files' sizes are rounded."
  - "pride download does not use this list. It calls DownloadProjectFilesAsync, which takes the DownloadFileAsync overload without a checksum, so no size, MD5 or EBI error-page check reaches it (pride thread, PRIDE-B5). Compare a downloaded file's size and MD5 with its row yourself."
  - "No total size is sent. mzLib has none over this list, and a sum made in the bridge would be the bridge's number, not mzLib's; sum size_bytes yourself."

bindings:
  py: {name: pymzlib.pride.file_checksums, note: "Returns a dict of PrideFileChecksum keyed by file_name, in the wire's order: mzLib's own shape, a map from name to row."}
  rust: {name: "mzlib::pride::file_checksums_with", note: "Takes a timeout, not an options struct. Returns a BTreeMap of PrideFileChecksum keyed by file name."}
  r: {name: pride_file_checksums, note: "Returns a data.frame, one row per file, in file-name order."}

examples:
  - fixture: pride_PXD000001_checksums.json
    py: "checksums = pymzlib.pride.file_checksums('PXD000001')"
    rust: "let checksums = mzlib::pride::file_checksums_with(\"PXD000001\", None)?;"
    r: "checksums <- pride_file_checksums('PXD000001')"

open_questions:
  - "mzLib checks that the project exists only when the list's body is empty. A body that is only the header returns 0 rows without that check, so a header-only answer for an unknown accession would read as a project with no checksums. PRIDE has not been seen to send one: it answers an unknown accession with an empty body (PXD999999999, 2026-10-21)."
  - "No public project with an empty list has been found, so the 0-row answer is pinned by a stubbed test only, not by a recorded fixture."
