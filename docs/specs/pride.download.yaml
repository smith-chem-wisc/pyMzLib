# Written 2026-09-24 from pyMzLib origin/main 06bfca9: pkg/bridge/Program.cs (PrideDownloadAsync,
# Arguments.WasProvided, ClassifyError, IsTransportFailure), pkg/python/src/pymzlib/pride.py (download,
# download_files), mzLib pin 23c2490e (PrideArchiveClient.DownloadProjectFilesAsync, DownloadFileAsync,
# CopyUntilStalledAsync; PrideArchiveExtensions.WhereCategory, WhereExtension). No recorded fixture
# exists for this verb (it writes files), so there is no example yet.
verb: pride download
module: pride
summary: >-
  Download a PRIDE project's files, all of them or a selection, into a directory and report the
  paths written.
since: {protocol: 1, pymzlib: "0.1.0", mzlibrust: "0.1.0", mzlibr: "0.1.0"}
wraps:
  - {symbol: PrideArchiveClient.DownloadProjectFilesAsync, path: mzLib/UsefulProteomicsDatabases/PrideArchiveClient.cs, pin: 23c2490e}
  - {symbol: PrideArchiveClient.DownloadFileAsync, path: mzLib/UsefulProteomicsDatabases/PrideArchiveClient.cs, pin: 23c2490e}
  - {symbol: PrideArchiveExtensions.WhereCategory, path: mzLib/UsefulProteomicsDatabases/PrideArchiveExtensions.cs, pin: 23c2490e}
  - {symbol: PrideArchiveExtensions.WhereExtension, path: mzLib/UsefulProteomicsDatabases/PrideArchiveExtensions.cs, pin: 23c2490e}
  - {symbol: PrideArchiveExtensions.GetHttpsDownloadUrl, path: mzLib/UsefulProteomicsDatabases/PrideArchiveExtensions.cs, pin: 23c2490e}
cite:
  - {doi: "10.1093/nar/gkae1011", for: "The PRIDE Archive, the repository files are fetched from (Perez-Riverol et al., The PRIDE database at 20 years: 2025 update, NAR)"}

params:
  - name: accession
    type: string
    required: true
    unit: null
    range: null
    default: null
    doc: The project accession, e.g. PXD000001. The bridge checks only that it is not blank.
  - name: dest
    type: path
    required: true
    unit: null
    range: null
    default: null
    doc: >-
      Directory to write into; created if absent, but only when a file is actually fetched (mzLib
      creates it after the no-overwrite skip). With zero matches, or every file skipped, no
      directory is created, yet destination_directory is still reported. Blank is a usage error
      (it never falls back to the working directory).
  - name: category
    type: string
    required: false
    unit: null
    range: "a PRIDE category value, case-insensitive: RAW, PEAK, SEARCH, RESULT, OTHER, ..."
    default: null
    doc: >-
      Keep only files of this category (mzLib WhereCategory). Absent keeps every category. Given
      but blank is a usage error, never 'everything'. ANDed with ext.
  - name: ext
    type: "string[]"
    required: false
    unit: null
    range: "comma-separated; a leading dot is optional"
    default: null
    doc: >-
      Keep only files whose name ends with one of these extensions, case-insensitive (mzLib
      WhereExtension), e.g. ".raw,.mzML". Absent keeps every type. Given but naming no extension
      (blank or only commas) is a usage error. A compressed file's extension is .gz.
  - name: no-overwrite
    type: flag
    required: false
    unit: null
    range: null
    default: false
    doc: >-
      Leave a file already present at the destination untouched and make no request for it: a
      cheap resume. Absent, an existing file is replaced.
  - name: names-from-stdin
    type: flag
    required: false
    unit: null
    range: null
    default: false
    doc: >-
      Select exact files instead of filtering: stdin carries file names, one per line
      (newline-delimited; blank lines ignored; each line trimmed; exact, case-sensitive match
      against the manifest's file_name). Exclusive with category and ext. Stdin rather than argv
      because argv caps near 32 KB and any other separator could occur in a file name. A name
      containing a line break cannot be selected (the bindings refuse one; PRIDE has never
      published one).
  - name: stdin
    type: "string[]"
    required: false
    unit: null
    range: ">= 1 non-blank line when names-from-stdin is given"
    default: null
    doc: >-
      Read only with names-from-stdin: the file names to fetch, one per line. Every name must be
      in the project's REST manifest (pride files). A UTF-8 BOM on the first line is stripped
      (ReadStdinLines) from pyMzLib #67 on; the 0.2.0 bridge keeps it, so that first name fails
      as not in the project.

result:
  envelope_fields:
    - {wire: accession, type: string, unit: null, nullable: false, null_means: null, doc: "The accession, echoed as given."}
    - {wire: destination_directory, type: string, unit: null, nullable: false, null_means: null, doc: "dest, made absolute."}
    - {wire: downloaded_count, type: int, unit: files, nullable: false, null_means: null, doc: "Entries in paths: files written PLUS, under no-overwrite, files already present and skipped."}
    - {wire: paths, type: "string[]", unit: null, nullable: false, null_means: null, doc: "One path per selected file, in manifest order: mzLib's Path.Combine(dest as given, file_name), so relative when dest was relative (resolve against destination_directory's parent, not this list)."}
  columns: []

errors:
  - {kind: usage, when: "accession or dest missing or blank; category given but blank; ext given but naming no extension; names-from-stdin together with category or ext; names-from-stdin with no non-blank line on stdin"}
  - {kind: usage, when: "names-from-stdin naming a file the project's manifest does not contain (the message lists up to five). Raised AFTER the matching files have been downloaded: they are on disk when the error arrives."}
  - {kind: service_unavailable, when: "the bridge's own classification (Program.ClassifyError; since mzLib 1.0.593 (#1350) PRIDE raises every transport failure as an HttpRequestException carrying the cause or the status, and messages name the file and host, never the URL): a timeout, a socket or TLS failure, an HTTP 408, 429 or 5xx on the manifest or a file, a body that delivered nothing for mzLib's BodyStallTimeout (2 min), or a body cut off in transit"}
  - {kind: correctness, when: "a selected file has no HTTPS location (NotSupportedException; Aspera-only); a manifest file name that is not a bare leaf name (ArgumentException: refusing to write outside dest); any other HTTP status; a local disk failure while writing (a bare IOException, e.g. a full disk, is deliberately NOT treated as an outage)"}

caveats:
  - "Selects from PRIDE's REST manifest (pride files), which omits some files; a file listed only by pride ftp-files cannot be downloaded by this verb."
  - "Files are fetched one at a time, in manifest order. Each streams to '<name>.partial' and is moved into place only when complete, so an interrupted transfer never leaves a truncated file; files finished before a failure stay on disk."
  - "A filter that matches nothing, or an unknown accession, succeeds with downloaded_count 0 on the wire. The bindings raise a usage error when a category or ext filter matched nothing."
  - "Downloads can be very large (PXD000001's single .raw is about 220 MB); list first and filter or select."

bindings:
  py: {name: pymzlib.pride.download, selection: pymzlib.pride.download_files}
  rust: {name: "mzlib::pride::download", selection: "mzlib::pride::download_files", options: DownloadOptions}
  r: {name: pride_download, selection: pride_download_files}

examples: []

open_questions:
  - "No recorded fixture, so no checked example: a replay needs a stub bridge that also fakes the written files. The envelope keys above are from ToWire in PrideDownloadAsync, not from a recording."
  - "The unmatched-selection check runs after the download, so a typo in one name still downloads every other selected file before failing. Checking the manifest first would need the bridge to fetch it separately from DownloadProjectFilesAsync."
  - "downloaded_count counts skipped files under no-overwrite; the wire has no separate skipped count."
  - "'selection' under bindings names the names-from-stdin projection (download_files in every binding); tools/check_verbs.py does not read it."
  - "A zero-match filter is a usage error in the bindings but a success on the wire; whether the wire should raise it (as it does for an unmatched names-from-stdin selection) is undecided."
  - "Wire params dest, ext, no-overwrite, names-from-stdin and stdin project as destination, extensions, overwrite (inverted) and download_files(files) in every binding; pyMzLib's spec lint will need PYTHON_DEVIATIONS entries."
